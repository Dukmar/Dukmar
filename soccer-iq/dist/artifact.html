<title>Pitch IQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Lexend:wght@400;500;700&family=Permanent+Marker&display=swap">
<style>
/* Pitch IQ — a coach's chalkboard laid over a sunny 3D pitch.
   Layout: full-screen 3D stage; UI floats on top as a top bar plus one bottom "chalkboard" sheet. */
:root {
  --board: #0b3a26;        /* chalkboard green */
  --board-2: #0f4a31;
  --board-edge: #1d6b47;
  --chalk: #f5f5ec;        /* chalk white */
  --chalk-dim: #b9cdbf;
  --cone: #ff7a1a;         /* training-cone orange: the one bold accent */
  --cone-deep: #d95f06;
  --pinnie: #ffe14d;       /* bib yellow: "you" and highlights */
  --good: #3ddc84;
  --bad: #ff6b6b;
  --sky: #bfe2ff;
  --ink: #10221a;
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Lexend', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif;
  --marker: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive;
  --r: 14px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--board); color: var(--chalk); font-family: var(--body); font-size: 16px; overflow: hidden; }
body { -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--pinnie); outline-offset: 2px; }

#app { position: fixed; inset: 0; top: 0; left: 0; right: 0; bottom: 0; }
#stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(#bfe2ff, #47a84c); }
.stage-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.label-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; }
#ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui .passthru { pointer-events: none; }
#ui .passthru > * { pointer-events: auto; }

/* ---------- floating labels over players ---------- */
.flabel { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 700; will-change: transform; }
.flabel.you { background: var(--pinnie); color: var(--ink); font-family: var(--display); font-size: 15px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.flabel.you::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--pinnie); }
.flabel.tag { background: rgba(11,58,38,0.88); color: var(--chalk); font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(245,245,236,0.35); }
.flabel.opt { background: var(--chalk); color: var(--ink); font-family: var(--display); font-size: 18px; width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 50%; border: 3px solid var(--cone); }
.flabel.think { background: #fff; color: var(--ink); font-family: var(--marker); font-weight: 400; font-size: 14px; padding: 6px 10px; border-radius: 14px; max-width: 200px; white-space: normal; width: max-content; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
.flabel.think::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
.flabel.call { background: var(--cone); color: #fff; font-family: var(--display); font-size: 20px; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 10px; transform-origin: 50% 100%; animation: pop 0.35s ease-out; }
.flabel.good { background: var(--good); color: var(--ink); font-size: 13px; padding: 3px 8px; border-radius: 8px; }
.flabel.bad { background: var(--bad); color: var(--ink); font-size: 13px; padding: 3px 8px; border-radius: 8px; }
@keyframes pop { 0% { opacity: 0; } 60% { opacity: 1; } }

/* ---------- top bar ---------- */
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) max(12px, var(--safe-r)) 10px max(12px, var(--safe-l)); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.topbar .title { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .title:not(:empty) { background: rgba(11,58,38,0.86); border-radius: 12px; padding: 0 12px; line-height: 44px; height: 44px; box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.topbar .spacer { flex: 1; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(11,58,38,0.86); color: var(--chalk); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:active { transform: translateY(1px); }
.chip { background: rgba(11,58,38,0.86); border-radius: 999px; padding: 0 14px; height: 36px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { color: var(--pinnie); }

/* ---------- chalkboard sheet ---------- */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 760px;
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(var(--board-2), var(--board));
  border-top: 3px solid var(--board-edge);
  border-radius: 20px 20px 0 0;
  padding: 16px max(16px, var(--safe-r)) calc(16px + var(--safe-b)) max(16px, var(--safe-l));
  box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
  max-height: 58%; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.sheet.tall { max-height: 82%; }
.sheet.mini { max-height: 40%; }
.sheet h2 { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.03em; }
.sheet p { margin: 0 0 10px; line-height: 1.5; font-size: 16px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 4px; }
.coachnote { font-family: var(--marker); color: var(--pinnie); font-size: 17px; line-height: 1.35; margin: 4px 0 10px; }
.caption { font-size: 18px; line-height: 1.5; min-height: 3em; }
.caption strong { color: var(--pinnie); font-weight: 700; }
.small { font-size: 13px; color: var(--chalk-dim); line-height: 1.45; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--cone); color: #fff; box-shadow: 0 3px 0 var(--cone-deep); min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cone-deep); }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 2px rgba(245,245,236,0.55); }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--chalk); }
.btn.chalk { background: var(--chalk); color: var(--ink); box-shadow: 0 3px 0 #b9b9ad; }
.btn.small { padding: 8px 12px; min-height: 40px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }

/* camera dock */
.camdock { position: absolute; right: max(10px, var(--safe-r)); top: calc(66px + var(--safe-t)); display: flex; flex-direction: column; gap: 6px; }
.camdock button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(11,58,38,0.8); color: var(--chalk); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.camdock button svg { width: 20px; height: 20px; }
.camdock button.on { background: var(--pinnie); color: var(--ink); }

/* ---------- home ---------- */
.home { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(18px + var(--safe-t)) max(16px, var(--safe-r)) calc(24px + var(--safe-b)) max(16px, var(--safe-l)); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.home > * { pointer-events: auto; }
.logo { text-align: center; margin: 4px 0 14px; pointer-events: none; }
.logo .word { font-family: var(--display); font-weight: 900; font-size: clamp(54px, 13vw, 96px); line-height: 0.85; letter-spacing: 0.01em; color: #fff; text-shadow: 0 4px 0 var(--board), 0 8px 24px rgba(0,0,0,0.35); text-transform: uppercase; }
.logo .word span { color: var(--pinnie); }
.logo .tag { font-family: var(--marker); font-size: 18px; color: var(--board); background: var(--pinnie); display: inline-block; padding: 2px 12px; border-radius: 6px; transform: rotate(-2deg); margin-top: 8px; }
.playercard { display: flex; gap: 12px; align-items: center; background: rgba(11,58,38,0.9); border-radius: 18px; padding: 10px 14px; width: 100%; max-width: 520px; margin-bottom: 12px; cursor: pointer; border: 0; text-align: left; }
.shirt { width: 54px; height: 54px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; font-size: 28px; color: #fff; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.18); }
.playercard .who { flex: 1; min-width: 0; }
.playercard .name { font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.playercard .lvl { font-size: 13px; color: var(--chalk-dim); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--pinnie); border-radius: 99px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; }
.tile { border: 0; border-radius: 18px; padding: 14px; text-align: left; cursor: pointer; background: var(--chalk); color: var(--ink); min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 0 rgba(0,0,0,0.25); position: relative; overflow: hidden; }
.tile:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.tile .t { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 0.95; text-transform: uppercase; }
.tile .s { font-size: 13px; line-height: 1.35; opacity: 0.8; }
.tile svg { width: 30px; height: 30px; }
.tile.hero { grid-column: 1 / -1; background: var(--cone); color: #fff; min-height: 96px; }
.tile.green { background: var(--board-2); color: var(--chalk); box-shadow: 0 4px 0 rgba(0,0,0,0.35), inset 0 0 0 2px var(--board-edge); }
.tile.yellow { background: var(--pinnie); }
.tile .pct { position: absolute; right: 12px; top: 12px; font-family: var(--display); font-weight: 700; font-size: 16px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 0; text-align: left; cursor: pointer; width: 100%; min-height: 60px; }
.item:active { background: rgba(255,255,255,0.12); }
.item .num { width: 36px; height: 36px; border-radius: 10px; background: var(--chalk); color: var(--ink); font-family: var(--display); font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
.item .num.done { background: var(--good); }
.item .txt { flex: 1; min-width: 0; }
.item .txt b { display: block; font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .txt span { display: block; font-size: 13px; color: var(--chalk-dim); line-height: 1.3; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.locked { opacity: 0.5; }
.stars { color: var(--pinnie); letter-spacing: 1px; font-size: 16px; white-space: nowrap; flex: none; }
.stars .off { color: rgba(255,255,255,0.22); }

/* ---------- quiz ---------- */
.answers { display: grid; gap: 8px; margin-top: 6px; }
.answer { border: 0; border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 16px; line-height: 1.35; background: var(--chalk); color: var(--ink); cursor: pointer; min-height: 52px; box-shadow: 0 3px 0 #b9b9ad; display: flex; gap: 10px; align-items: center; }
.answer .k { font-family: var(--display); font-weight: 900; font-size: 20px; width: 28px; height: 28px; border-radius: 8px; background: var(--board); color: var(--chalk); display: flex; align-items: center; justify-content: center; flex: none; }
.answer.right { background: var(--good); box-shadow: 0 3px 0 #23a660; }
.answer.wrong { background: var(--bad); box-shadow: 0 3px 0 #cc4a4a; animation: shake 0.35s; }
.answer.dim { opacity: 0.5; }
.answers.locked .answer { pointer-events: none; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.why { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.08); line-height: 1.5; }
.why b { color: var(--pinnie); }

/* HUD for games */
.hud { position: absolute; left: 50%; transform: translateX(-50%); top: calc(64px + var(--safe-t)); display: flex; gap: 8px; pointer-events: none; }
.timer { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: rgba(0,0,0,0.25); }
.timer i { display: block; height: 100%; background: var(--pinnie); transition: width 0.1s linear; }
.bigmsg { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 900; font-size: clamp(44px, 12vw, 88px); text-transform: uppercase; color: #fff; text-shadow: 0 4px 0 var(--board), 0 10px 30px rgba(0,0,0,0.4); pointer-events: none; white-space: nowrap; animation: big 0.9s ease-out both; }
@keyframes big { 0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 700; color: var(--chalk-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.field input { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--board-edge); background: rgba(0,0,0,0.25); color: var(--chalk); -webkit-user-select: text; user-select: text; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 10px; border: 3px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--pinnie); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { background: rgba(255,255,255,0.07); border-radius: 12px; padding: 10px; font-size: 13px; line-height: 1.35; }
.badge b { display: block; font-family: var(--display); font-size: 18px; text-transform: uppercase; }
.badge.on { background: var(--pinnie); color: var(--ink); }
.badge.off { opacity: 0.55; }

/* rules */
.rule { padding: 12px 0; border-bottom: 1px dashed rgba(245,245,236,0.25); }
.rule:last-child { border-bottom: 0; }
.rule h4 { margin: 0 0 4px; font-size: 16px; }
.rule p { margin: 0 0 6px; font-size: 15px; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,225,77,0.18); color: var(--pinnie); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }

/* toolbar (tactics board) */
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; color: var(--chalk); border-radius: 9px; padding: 8px 10px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 38px; }
.seg button.on { background: var(--chalk); color: var(--ink); }

#toast { position: absolute; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); background: var(--pinnie); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.nogl { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--board); }

@media (min-width: 900px) {
  .sheet { bottom: 16px; border-radius: 20px; border: 3px solid var(--board-edge); max-height: 52%; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .sheet, .sheet.mini, .sheet.tall { max-width: 46%; left: auto; right: max(8px, var(--safe-r)); bottom: 8px; top: calc(62px + var(--safe-t)); max-height: none; border-radius: 16px; margin: 0; padding-top: 12px; }
  .caption { font-size: 16px; min-height: 0; }
  .camdock { right: auto; left: max(10px, var(--safe-l)); }
  .logo .word { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
<div id="app">
  <div id="stage"></div>
  <div id="ui"></div>
  <div id="toast" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
/* js/core.js */
/* Pitch IQ — core helpers: namespace, maths, storage, sound.
   Written in ES2017 with no modules so it runs from a double-clicked file
   and in older Safari (no optional chaining, no class fields). */
(function () {
  'use strict';
  var PIQ = (window.PIQ = window.PIQ || {});

  // ---------- small maths ----------
  PIQ.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  PIQ.lerp = function (a, b, t) { return a + (b - a) * t; };
  PIQ.ease = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  PIQ.dist = function (a, b) { var dx = a[0] - b[0], dz = a[1] - b[1]; return Math.sqrt(dx * dx + dz * dz); };
  PIQ.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  PIQ.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  PIQ.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // distance from point p to segment ab (all [x,z])
  PIQ.segDist = function (p, a, b) {
    var abx = b[0] - a[0], abz = b[1] - a[1];
    var len2 = abx * abx + abz * abz || 1e-6;
    var t = PIQ.clamp(((p[0] - a[0]) * abx + (p[1] - a[1]) * abz) / len2, 0, 1);
    return PIQ.dist(p, [a[0] + abx * t, a[1] + abz * t]);
  };

  // ---------- storage (per-device progress; never required) ----------
  var KEY = 'pitchiq.v1';
  PIQ.store = {
    load: function () {
      try {
        var raw = window.localStorage.getItem(KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    save: function (data) {
      try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode */ }
    }
  };

  // ---------- sound (synthesised, starts only after a tap) ----------
  var ctx = null;
  var muted = false;
  function ac() {
    if (muted) return null;
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (when || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, filterFreq, when, swell) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (when || 0);
    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = c.createBufferSource(); src.buffer = buf;

    boxW: 22,         // penalty area width (Ontario: 20–24 m)

/* js/player.js */
/* Pitch IQ — runs a lesson: a scene plus a list of "beats". Each beat shows a
   caption, draws arrows/zones/labels, and moves players and the ball.
   Beat fields (all optional):
     say      caption HTML
     cam      camera preset or {target,dist,theta,phi}
     move     {id:[x,z] | id}         players jog there ('away:F' for opponents)
     pass     {to:id|[x,z], from:id, lofted:h, delay:s, owner:true}
     dribble  {who:id, to:[x,z]}
     shoot    {to:[x,z], from:id, delay:s}
     arrows   [[from, to, kind, bend]]  kind: run | pass | dribble
     zones    [{at:[x,z], r, color, pulse} | {rect:[x1,z1,x2,z2], color}]
     links    [[idA, idB, color]]
     tags / think / calls   {id: text}
     rings    {id: color}
     pov      id  (first-person view from that player), scan: true to look around
     dur      motion time in seconds */
(function () {
  'use strict';
  var PIQ = window.PIQ;

  function LessonPlayer(stage, lesson, hooks) {
    this.stage = stage;
    this.lesson = lesson;
    this.hooks = hooks || {};
    this.i = -1;
    this.snaps = [];
    this.rings = [];
    PIQ.buildScene(stage, lesson.scene, { instantCamera: true });
    if (lesson.scene.camera) stage.setCamera(lesson.scene.camera, true);
  }

  LessonPlayer.prototype.count = function () { return this.lesson.beats.length; };

  LessonPlayer.prototype.go = function (i) {
    var st = this.stage;
    if (i < 0 || i >= this.count()) return;
    st.finishAll();
    if (i <= this.i) {
      // going back (or replaying): restore the state from the start of that beat
      st.restore(this.snaps[i]);
    } else {
      // going forward: capture the state at the start of each beat on the way
      for (var k = this.i + 1; k <= i; k++) {
        if (k < i) { this.snaps[k] = st.snapshot(); this._run(this.lesson.beats[k], true); st.finishAll(); }
      }
      this.snaps[i] = st.snapshot();
    }
    this.i = i;
    this._run(this.lesson.beats[i], false);
    if (this.hooks.onBeat) this.hooks.onBeat(i, this.lesson.beats[i]);
  };
  LessonPlayer.prototype.next = function () { this.go(this.i + 1); };
  LessonPlayer.prototype.prev = function () { this.go(this.i - 1); };
  LessonPlayer.prototype.replay = function () { this.go(this.i); };

  LessonPlayer.prototype._clearBeat = function () {
    var st = this.stage;
    st.clearAnnotations();
    st.clearLabels(true);
    this.rings.forEach(function (p) { if (!st.labels.some(function (l) { return l.target === p.id && /you/.test(l.el.className); })) p.ring.visible = false; });
    this.rings = [];
    if (this._scanTimer) { clearInterval(this._scanTimer); this._scanTimer = null; }
  };

  LessonPlayer.prototype._run = function (b, silent) {
    var st = this.stage, self = this;
    var P = function (ref) { return PIQ.pt(st, ref); };
    this._clearBeat();
    var dur = b.dur || 1.6;

    if (!silent) {
      if (b.pov) {
        st.setPOV(b.pov, b.povLook ? P(b.povLook) : null);
        if (b.scan) {
          var t0 = Date.now();
          this._scanTimer = setInterval(function () {
            if (!st.pov) return;
            var e = (Date.now() - t0) / 1000;
            st.pov.yaw = e < 3.6 ? Math.sin(e * 1.75) * 2.2 : 0;
            if (e > 3.8) { clearInterval(self._scanTimer); self._scanTimer = null; }
          }, 30);
        }
      } else if (b.cam) st.setCamera(b.cam);
      else if (st.pov) st.setCamera(this.lesson.scene.camera || 'broadcast');
    }

    // annotations
    (b.zones || []).forEach(function (z) {
      if (z.rect) st.zone(z.rect, null, { color: z.color, opacity: z.opacity });
      else st.zone(P(z.at), z.r || 3, { color: z.color, pulse: z.pulse, opacity: z.opacity });
    });
    (b.arrows || []).forEach(function (a) {
      var from = P(a[0]), to = P(a[1]);
      var col = a[4] === 'bad' ? PIQ.COLORS.bad : a[4] === 'good' ? PIQ.COLORS.good : a[4];
      if (from && to) st.arrow(from, to, a[2] || 'run', { color: col, bend: a[3] || 0, startCut: typeof a[0] === 'string' ? 0.7 : 0.1, endCut: typeof a[1] === 'string' && a[1] !== 'goal' && a[1] !== 'ourgoal' ? 0.8 : 0.1 });
    });
    (b.links || []).forEach(function (l) { st.link(l[0], l[1], l[2]); });
    function labels(map, cls) {
      if (!map) return;
      Object.keys(map).forEach(function (id) { st.label(id, map[id], cls); });
    }
    if (!silent) {
      labels(b.tags, 'tag');
      labels(b.think, 'think');
      labels(b.calls, 'call');
      (b.notes || []).forEach(function (n) { st.label(n[0], n[1], n[2] || 'tag', { y: n[3] || 0.6 }); });
    }
    if (b.rings) Object.keys(b.rings).forEach(function (id) {
      var p = st.players[id];
      var c = b.rings[id];
      c = c === 'bad' ? PIQ.COLORS.bad : c === 'good' ? PIQ.COLORS.good : c === true ? PIQ.COLORS.info : c;
      if (p) { PIQ.setRing(p, c, true); self.rings.push(p); }
    });

    // motion
    var wait = b.wait || 0;
    if (b.move) {
      Object.keys(b.move).forEach(function (id) {
        var to = P(b.move[id]);
        if (!to) return;
        var p = st.players[id];
        var d = p ? PIQ.dist(p.pos, to) : 0;
        st.after(wait, function () { st.moveTo(id, to, b.runTime || Math.max(dur, d / 6.5)); });
      });
    }
    if (b.dribble) {
      st.after(wait, function () {
        var who = b.dribble.who || (st.ball.owner && st.ball.owner.id);
        if (!who) return;
        st.giveBall(who);
        st.players[who].faceBall = false;
        st.moveTo(who, P(b.dribble.to), b.dribble.dur || dur);
      });
    }
    if (b.pass) {
      st.after(wait + (b.pass.delay || 0), function () {
        var to = P(b.pass.to);
        var ownerId = typeof b.pass.to === 'string' && st.players[b.pass.to] ? b.pass.to : null;
        if (b.pass.from && st.players[b.pass.from]) st.giveBall(b.pass.from);
        var from = st.ball.owner;
        if (from) {
          from.faceBall = true;
          from.heading = Math.atan2(to[0] - from.pos[0], to[1] - from.pos[1]);
          from.obj.rotation.y = from.heading;
          st._carryBall();
        }
        var dest = to.slice();
        if (ownerId) {
          // aim just in front of the receiver
          var r = st.players[ownerId];
          var hd = Math.atan2(st.ball.pos[0] - r.pos[0], st.ball.pos[1] - r.pos[1]);
          dest = [r.pos[0] + Math.sin(hd) * 0.6, r.pos[1] + Math.cos(hd) * 0.6];
        }
        st.kickBall(dest, { height: b.pass.lofted || 0, dur: b.pass.dur, owner: ownerId, silent: silent, onDone: function () {
          if (ownerId) { var rp = st.players[ownerId]; rp.faceBall = false; rp.heading = rp.team === 'home' ? Math.PI / 2 : -Math.PI / 2; }
        } });
      });
    }
    if (b.shoot) {
      st.after(wait + (b.shoot.delay || 0), function () {
        if (b.shoot.from && st.players[b.shoot.from]) st.giveBall(b.shoot.from);
        var to = b.shoot.to || [PIQ.FIELD.L / 2 + 0.6, (Math.random() - 0.5) * 3];
        st.kickBall(to, { height: b.shoot.lofted || 0.4, dur: 0.7, silent: silent, onDone: function () {
          if (!silent && b.shoot.goal !== false) { PIQ.sfx.cheer(); }
        } });
      });
    }
    if (b.giveTo) st.after(wait, function () { st.giveBall(b.giveTo); });
    if (b.hideBall) st.ball.obj.visible = false;
    if (b.showBall) st.ball.obj.visible = true;
    if (b.whistle && !silent) PIQ.sfx.whistle();
  };

  LessonPlayer.prototype.destroy = function () {
    this._clearBeat();
    this.stage.speedScale = 1;
  };

  PIQ.LessonPlayer = LessonPlayer;
})();

/* js/games/spoton.js */
/* Pitch IQ — Spot On: drag "YOU" to the right spot. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};

  function zoneGap(t, p) {
    if (t.rect) {
      var r = t.rect;
      var x1 = Math.min(r[0], r[2]), x2 = Math.max(r[0], r[2]), z1 = Math.min(r[1], r[3]), z2 = Math.max(r[1], r[3]);
      var dx = Math.max(x1 - p[0], 0, p[0] - x2), dz = Math.max(z1 - p[1], 0, p[1] - z2);
      return Math.sqrt(dx * dx + dz * dz);
    }
    return Math.max(0, PIQ.dist(p, t.at) - t.r);
  }
  PIQ.zoneGap = zoneGap;

  PIQ.GAMES.spoton = {
    start: function (App, back) {
      var stage = App.stage();
      var prof = PIQ.profile();
      prof.games.spotonStars = prof.games.spotonStars || {};
      // favour puzzles not yet mastered
      var pool = PIQ.shuffle(PIQ.SPOTON).sort(function (a, b) { return (prof.games.spotonStars[a.id] || 0) - (prof.games.spotonStars[b.id] || 0); });
      var round = PIQ.shuffle(pool.slice(0, 5));
      var idx = 0, total = 0;
      var I = App.ICONS;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Spot On', back, '<span class="chip" id="so-score">&#9733; <b>0</b></span>');
      var s = App.sheet('', 'mini');

      function scoreChip() { var c = document.getElementById('so-score'); if (c) c.innerHTML = '&#9733; <b>' + total + '</b> / ' + round.length * 3; }

      function play() {
        var sc = round[idx];
        PIQ.buildScene(stage, { home: sc.scene.home, away: sc.scene.away, ball: sc.scene.ball, you: sc.you, youAt: sc.youAt, camera: sc.scene.camera }, { instantCamera: true });
        stage.setDraggable([sc.you], true);
        var me = stage.players[sc.you];
        me.faceBall = true;
        // tapping the ground also moves you there (handy on small screens)
        stage.on('ground', function (g) { if (!locked) stage.moveTo(sc.you, g, 0.5); });
        var locked = false;
        s.innerHTML = '<div class="eyebrow">Puzzle ' + (idx + 1) + ' of ' + round.length + ' &middot; ' + sc.title + '</div>' +
          '<p class="caption">' + sc.prompt + '</p><p class="small">Drag yourself (or tap the field), then lock it in.</p>' +
          '<div class="row end"><button class="btn" id="so-lock">Lock it in</button></div>';
        s._fit();
        s.querySelector('#so-lock').onclick = function () {
          if (locked) return;
          locked = true;
          stage.setDraggable([sc.you], false);
          reveal(sc, me);
        };
      }

      function reveal(sc, me) {
        stage.finishAll();
        var gap = zoneGap(sc.target, me.pos);
        var stars = gap <= 0.01 ? 3 : gap <= 2.5 ? 2 : gap <= 6 ? 1 : 0;
        total += stars;
        scoreChip();
        var prev = prof.games.spotonStars[sc.id] || 0;
        if (stars > prev) prof.games.spotonStars[sc.id] = stars;
        PIQ.saveProfile();
        var mastered = Object.keys(prof.games.spotonStars).filter(function (k) { return prof.games.spotonStars[k] === 3; }).length;
        if (mastered >= 10) PIQ.award('spoton');

        if (sc.target.rect) stage.zone(sc.target.rect, null, { color: PIQ.COLORS.good, opacity: 0.25 });
        else stage.zone(sc.target.at, sc.target.r, { color: PIQ.COLORS.good, opacity: 0.25, pulse: true });
        stage.clearLabels(true);
        if (stars < 3) {
          stage.arrow(me.pos, sc.best, 'run', { color: PIQ.COLORS.good, startCut: 0.6, endCut: 0.2 });
          stage.label(sc.best, 'Best spot', 'good', { y: 0.4 });
        }
        if (stars >= 2) { PIQ.sfx.good(); App.bigmsg(stars === 3 ? 'Spot on!' : 'Close!'); }
        else if (stars === 1) PIQ.sfx.ok();
        else PIQ.sfx.bad();

        var words = ['Not quite.', 'Getting there.', 'Close!', 'Spot on!'][stars];
        s.innerHTML = '<div class="row between"><div class="eyebrow">' + words + '</div>' + App.stars(stars) + '</div>' +
          '<p class="caption">' + sc.explain + '</p>' +
          '<div class="row end"><button class="btn" id="so-next">' + (idx < round.length - 1 ? 'Next ' : 'Finish ') + I.next + '</button></div>';
        s._fit();

        // payoff: show why the spot matters
        var delay = stars >= 2 ? 0.3 : 1.6;
        if (stars < 2) stage.after(0.5, function () { stage.moveTo(sc.you, sc.best, 1.1); });
        if (sc.payoff === 'pass' || sc.payoff === 'goal') {
          stage.after(delay + 0.4, function () {
            if (!stage.ball.owner) {
              // loose ball at a restart: the nearest teammate takes it
              var near = null, nd = 3;
              stage.list.forEach(function (p) { if (p.team === 'home' && p.id !== sc.you) { var d = PIQ.dist(p.pos, stage.ball.pos); if (d < nd) { nd = d; near = p; } } });
              if (!near) return;
              stage.giveBall(near.id);
            }
            stage.kickBall(stage.ball.owner.id === sc.you ? sc.best : PIQ.pt(stage, sc.you), { owner: sc.you });
          });
        }
        if (sc.payoff === 'goal') {
          stage.after(delay + 1.9, function () {
            if (stage.ball.owner && stage.ball.owner.id === sc.you) stage.kickBall([25.6, (Math.random() - 0.5) * 2.4], { height: 0.4, dur: 0.6, onDone: function () { PIQ.sfx.cheer(); } });
          });
        }
        s.querySelector('#so-next').onclick = function () {
          PIQ.sfx.tap();
          idx++;
          if (idx < round.length) play(); else finish();
        };
      }

      function finish() {
        var max = round.length * 3;
        var best = PIQ.saveBest('spoton', total);
        PIQ.addXP(total * 4);
        PIQ.markDay();
        PIQ.sfx.cheer();
        stage.clearAnnotations(); stage.clearLabels();
        s.innerHTML = '<div class="eyebrow">Round done</div><h2>' + total + ' / ' + max + ' stars</h2>' +
          '<p class="small">' + (best ? 'New best! ' : '') + '+' + total * 4 + ' XP. ' + (total >= 12 ? 'You really know where to stand.' : 'Try the Academy unit "Where Do I Stand?" and play again.') + '</p>' +
          '<div class="row"><button class="btn ghost" id="so-back">Games</button><button class="btn" id="so-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#so-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.spoton.start(App, back); };
        s.querySelector('#so-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      scoreChip();
      play();
    }
  };
})();

/* js/games/mistake.js */
/* Pitch IQ — Spot the Mistake: tap the teammate who is out of position. */
(function () {

  PIQ.GAMES.mistake = {
    start: function (App, back) {

/* js/games/decide.js */
/* Pitch IQ — Pass, Dribble or Shoot? You have the ball: pick an option. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  var TIME = 14; // seconds per decision: generous, it's about thinking, not twitch speed

  function optLabel(o) {
    var R = PIQ.ROLES;
    if (o.type === 'shoot') return 'Shoot!';
    if (o.type === 'dribble') return 'Dribble into space';
    if (o.type === 'clear') return 'Kick it out of play';
    if (o.type === 'punt') return 'Kick it long';
    if (o.runner) return 'Pass into space for the ' + R[o.runner].name.toLowerCase();
    var who = R[o.to] ? R[o.to].name.toLowerCase() : 'teammate';
    return 'Pass to the ' + (o.to === 'GK' ? 'keeper' : who);
  }

  PIQ.GAMES.decide = {
    start: function (App, back) {
      var stage = App.stage();
      var round = PIQ.shuffle(PIQ.DECISIONS).slice(0, 6);
      var idx = 0, score = 0, streak = 0;
      var I = App.ICONS;
      var timerId = null;

      App.leave();
      App.setCurrent({ destroy: function () { if (timerId) clearInterval(timerId); } });
      App.topbar('Pass, Dribble or Shoot?', back, '<span class="chip" id="dc-score"><b>0</b> pts</span>');
      App.camDock(null);
      var timerBar = App.el('<div class="timer"><i style="width:100%"></i></div>');
      document.getElementById('ui').appendChild(timerBar);
      var s = App.sheet('', 'mini');

      function where(o) {
        if (o.type === 'shoot') return o.target ? [o.target[0] - 1.4, o.target[1]] : [23.6, 0];
        if (o.type === 'pass' && !o.runner) return PIQ.pt(stage, o.to);
        return o.to;
      }

      function play() {
        var sc = round[idx];
        PIQ.buildScene(stage, { home: sc.scene.home, away: sc.scene.away, ball: sc.scene.ball, you: sc.you, camera: sc.scene.camera }, { instantCamera: true });
        var opts = PIQ.shuffle(sc.options).map(function (o, i) { var c = {}; for (var k in o) c[k] = o[k]; c.key = 'ABC'[i]; return c; });
        opts.forEach(function (o) {
          var w = where(o);
          if (o.type === 'dribble' || o.runner) stage.zone(w, 1.6, { color: PIQ.COLORS.zone, pulse: true });
          stage.label(o.type === 'pass' && !o.runner ? o.to : w, o.key, 'opt', { y: o.type === 'pass' && !o.runner ? 2.6 : 0.8 });
        });
        var answered = false;
        s.innerHTML = '<div class="eyebrow">Decision ' + (idx + 1) + ' of ' + round.length + '</div><p class="caption">' + sc.prompt + '</p>' +
          '<div class="answers">' + opts.map(function (o) { return '<button class="answer" data-k="' + o.key + '"><span class="k">' + o.key + '</span><span>' + optLabel(o) + '</span></button>'; }).join('') + '</div>';
        s._fit();
        var t0 = Date.now();
        if (timerId) clearInterval(timerId);
        timerId = setInterval(function () {
          var left = 1 - (Date.now() - t0) / (TIME * 1000);
          timerBar.firstChild.style.width = Math.max(0, left * 100) + '%';
          if (left <= 0) { clearInterval(timerId); timerId = null; if (!answered) choose(null); }
        }, 100);
        s.querySelector('.answers').addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('.answer') : null;
          if (b) choose(opts.filter(function (o) { return o.key === b.getAttribute('data-k'); })[0]);
        });
        // tap the receiver or the space on the field too
        stage.on('pick', function (p) {
          var o = opts.filter(function (x) { return x.type === 'pass' && !x.runner && x.to === p.id; })[0];
          if (o) choose(o);
        });
        stage.on('ground', function (g) {
          var best = null, bd = 3;
          opts.forEach(function (o) { var d = PIQ.dist(g, where(o)); if (d < bd) { bd = d; best = o; } });
          if (best) choose(best);
        });

        function choose(o) {
          if (answered) return;
          answered = true;
          if (timerId) { clearInterval(timerId); timerId = null; }
          var secs = (Date.now() - t0) / 1000;
          var pts = 0;
          stage.clearLabels(true); stage.clearAnnotations();
          if (!o) {
            streak = 0;
            PIQ.sfx.bad();
            App.bigmsg('Too slow!');
            o = opts.filter(function (x) { return x.grade === 'best'; })[0];
            act(o);
            feedback(o, 0, 'Out of time! Here\'s the best choice.');
            return;
          }
          if (o.grade === 'best') { pts = 3 + (secs < 5 ? 1 : 0); streak++; PIQ.sfx.good(); App.bigmsg(secs < 5 ? 'Quick &amp; smart!' : 'Smart!'); }
          else if (o.grade === 'ok') { pts = 1; streak = 0; PIQ.sfx.ok(); }
          else { streak = 0; PIQ.sfx.bad(); }
          if (streak >= 5) PIQ.award('decider');
          score += pts;
          document.getElementById('dc-score').innerHTML = '<b>' + score + '</b> pts';
          act(o);
          var bestO = opts.filter(function (x) { return x.grade === 'best'; })[0];
          feedback(o, pts, o.grade === 'best' ? '' : 'Best choice: <b>' + bestO.key + '. ' + optLabel(bestO) + '</b>.');
        }

        function act(o) {
          var you = stage.players[sc.you];
          var target = where(o);
          if (o.type === 'pass' && !o.runner) {
            stage.kickBall(PIQ.pt(stage, o.to), { owner: o.to });
          } else if (o.runner) {
            stage.kickBall(o.to, { dur: 1.1 });
            stage.moveTo(o.runner, o.to, 1.1);
            stage.after(1.15, function () { stage.giveBall(o.runner); });
          } else if (o.type === 'dribble') {
            stage.giveBall(sc.you); you.faceBall = false;
            stage.moveTo(sc.you, o.to, 1.4);
          } else if (o.type === 'shoot') {
            var aim = o.target || [25.6, (Math.random() - 0.5) * 3];
            var blocked = o.grade === 'bad';
            stage.kickBall(blocked ? target : aim, { height: blocked ? 0.2 : 0.5, dur: 0.7, onDone: function () { if (!blocked) PIQ.sfx.cheer(); } });
          } else {
            stage.kickBall(o.to, { height: 4, dur: 1.4 });
          }
          if (o.grade !== 'bad') {
            stage.zone(o.type === 'pass' && !o.runner ? PIQ.pt(stage, o.to) : target, 1.4, { color: PIQ.COLORS.good });
          }
        }

        function feedback(o, pts, extra) {
          s.innerHTML = '<div class="row between"><div class="eyebrow">' + (o.grade === 'best' ? 'Great choice' : o.grade === 'ok' ? 'Not bad' : 'Hmm') + '</div><span class="chip">+' + pts + '</span></div>' +
            '<p class="caption">' + o.why + (extra ? ' ' + extra : '') + '</p>' +
            '<div class="row end"><button class="btn" id="dc-next">' + (idx < round.length - 1 ? 'Next ' : 'Finish ') + I.next + '</button></div>';
          s._fit();
          s.querySelector('#dc-next').onclick = function () {
            PIQ.sfx.tap();
            idx++;
            if (idx < round.length) play(); else finish();
          };
        }
      }

      function finish() {
        timerBar.firstChild.style.width = '0%';
        var best = PIQ.saveBest('decide', score);
        PIQ.addXP(score * 2);
        PIQ.markDay();
        PIQ.sfx.cheer();
        stage.clearAnnotations(); stage.clearLabels();
        s.innerHTML = '<div class="eyebrow">Round done</div><h2>' + score + ' points</h2>' +
          '<p class="small">' + (best ? 'New best! ' : '') + '+' + score * 2 + ' XP. Best choices score 3, fast best choices score 4.</p>' +
          '<div class="row"><button class="btn ghost" id="dc-back">Games</button><button class="btn" id="dc-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#dc-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.decide.start(App, back); };
        s.querySelector('#dc-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      play();
    }
  };
})();

/* js/games/keeper.js */
/* Pitch IQ — Keeper Hero: move the keeper to the right angle before the shot. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  var F = PIQ.FIELD;
  var GX = -F.L / 2;          // our goal line
  var POST = F.goalW / 2;
  var SHOTS = 10;

  // the spot a keeper should take: on the ball-to-centre line, a few steps out
  function idealSpot(ball) {
    var dx = ball[0] - GX, dz = ball[1];
    var d = Math.sqrt(dx * dx + dz * dz);
    var out = PIQ.clamp(d * 0.25, 1.5, 3.5);
    return [GX + dx / d * out, dz / d * out];
  }
  PIQ.keeperIdeal = idealSpot;

  PIQ.GAMES.keeper = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var n = 0, saves = 0, phase = 'idle', alive = true;

      App.leave();
      App.setCurrent({ destroy: function () { alive = false; } });
      App.topbar('Keeper Hero', back, '<span class="chip" id="kp-score">Saves <b>0</b></span>');
      var s = App.sheet('<div class="eyebrow">You\'re the keeper</div><p class="caption">The attacker dribbles, then shoots. <b>Drag anywhere</b> on the field to move. Stand between the ball and the middle of the goal, a few steps off your line.</p>' +
        '<div class="row end"><button class="btn" id="kp-go">Start ' + I.next + '</button></div>', 'mini');

      PIQ.buildScene(stage, {
        home: { GK: [-24, 0], LD: [-16, -9], RD: [-15, 9] },
        away: { F: [-10, 4] },
        ball: 'away:F', you: 'GK',
        camera: { target: [-15, 0], dist: 20, theta: -Math.PI / 2 + 0.0001, phi: 1.0, portraitDist: 30, portraitTheta: -Math.PI / 2 }
      });
      var gk = stage.players.GK, att = stage.players['away:F'];
      gk.faceBall = true;
      var aim = { x: gk.pos[0], z: gk.pos[1] };
      function steer(g) {
        if (!g || phase === 'idle' || phase === 'done') return;
        aim.x = PIQ.clamp(g[0], GX + 0.3, GX + 10);
        aim.z = PIQ.clamp(g[1], -9, 9);
      }
      stage.on('groundDrag', function (g) { steer(g); });
      stage.on('ground', function (g) { steer(g); });

      // keeper chases the finger at a keeper's speed
      var lastT = Date.now();
      var speedTimer = setInterval(function () {
        if (!alive) { clearInterval(speedTimer); return; }
        var now = Date.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
        if (phase === 'idle' || phase === 'done') return;
        var dx = aim.x - gk.pos[0], dz = aim.z - gk.pos[1];
        var d = Math.sqrt(dx * dx + dz * dz);
        var max = 6.5 * dt;
        if (d > 0.02) {
          var k = Math.min(1, max / d);
          PIQ.setPlayerPos(gk, gk.pos[0] + dx * k, gk.pos[1] + dz * k);
          gk.speed = d > 0.1 ? 5 : 0; gk._dragSpeedT = 0.1;
          gk.heading = Math.atan2(dx, dz);
        }
      }, 16);

      function score() { var c = document.getElementById('kp-score'); if (c) c.innerHTML = 'Saves <b>' + saves + '</b> / ' + n; }

      function shot() {
        if (!alive) return;
        n++;
        phase = 'dribble';
        stage.clearAnnotations(); stage.clearLabels(true);
        var spot = [PIQ.lerp(-17, -9, Math.random()), (Math.random() * 2 - 1) * 11];
        if (Math.abs(spot[1]) > 7 && spot[0] < -14) spot[0] = -12;
        var speed = 3.6 + n * 0.35;
        var dur = Math.max(0.9, PIQ.dist(att.pos, spot) / speed);
        stage.giveBall('away:F');
        att.faceBall = false;
        stage.moveTo('away:F', spot, dur);
        s.innerHTML = '<div class="eyebrow">Shot ' + n + ' of ' + SHOTS + '</div><p class="caption">Get your angle right!</p>';
        s._fit();
        stage.after(dur + 0.55 - Math.min(0.3, n * 0.03), function () { take(spot); });
      }

      function take(ball) {
        if (!alive) return;
        phase = 'shot';
        // the shooter aims at the side the keeper leaves open
        var sides = [-POST + 0.35, POST - 0.35].map(function (z) {
          return { z: z, gap: PIQ.segDist(gk.pos, ball, [GX, z]) };
        }).sort(function (a, b) { return b.gap - a.gap; });
        var pick = Math.random() < 0.8 ? sides[0] : sides[1];
        var keeperOut = gk.pos[0] - GX;
        var chip = keeperOut > 7;
        var target = [GX - 0.6, pick.z];
        var gap = PIQ.segDist(gk.pos, ball, target);
        var saved = !chip && gap < 2.1; // forgiving reach: within ~0.5 m of the textbook spot saves about 9 in 10
        att.heading = Math.atan2(target[0] - att.pos[0], target[1] - att.pos[1]);
        att.obj.rotation.y = att.heading;
        stage._carryBall();
        var ideal = idealSpot(ball);
        var hit = saved ? [gk.pos[0] + (ball[0] - gk.pos[0]) * 0.08, gk.pos[1] + (ball[1] - gk.pos[1]) * 0.08] : target;
        stage.kickBall(hit, { height: chip ? 2.6 : 0.45, dur: chip ? 1 : 0.55, onDone: function () {
          if (!alive) return;
          phase = 'done';
          if (saved) {
            saves++;
            // a little dive toward the shot
            var side = PIQ.segDist([gk.pos[0], gk.pos[1] + 0.5], ball, target) < gap ? 1 : -1;
            gk.body.rotation.z = -side * 0.9;
            stage.after(0.7, function () { gk.body.rotation.z = 0; });
            stage.giveBall('GK');
            PIQ.sfx.good();
            App.bigmsg(PIQ.pick(['Save!', 'Great hands!', 'Denied!']));
          } else {
            PIQ.sfx.bad();
            App.bigmsg('Goal');
          }
          score();
          var off = PIQ.dist(gk.pos, ideal);
          stage.zone(ideal, 0.9, { color: PIQ.COLORS.good, pulse: true });
          stage.arrow(ball, [GX, -POST], 'pass', { color: PIQ.COLORS.bad, startCut: 0.5, endCut: 0 });
          stage.arrow(ball, [GX, POST], 'pass', { color: PIQ.COLORS.bad, startCut: 0.5, endCut: 0 });
          var tip = chip ? 'You came out too far and she chipped it over you. Stay a few steps off your line.'
            : saved ? (off < 1.2 ? 'Perfect angle!' : 'Saved! The green circle is the textbook spot.')
            : off > 1.2 ? 'The green circle shows the best spot: on the line from the ball to the middle of the goal.'
            : 'Good spot, but she found the corner. Keep your feet set before the shot!';
          s.innerHTML = '<div class="eyebrow">Shot ' + n + ' of ' + SHOTS + '</div><p class="caption">' + tip + '</p>' +
            '<div class="row end"><button class="btn" id="kp-next">' + (n < SHOTS ? 'Next shot ' : 'Finish ') + I.next + '</button></div>';
          s._fit();
          s.querySelector('#kp-next').onclick = function () {
            PIQ.sfx.tap();
            if (n < SHOTS) { reset(); shot(); } else finish();
          };
        } });
      }

      function reset() {
        stage.finishAll();
        var b = stage.ball.pos.slice();
        stage.giveBall('away:F');
        PIQ.setPlayerPos(att, b[0] > GX + 3 ? att.pos[0] : -10, att.pos[1]);
        PIQ.setPlayerPos(gk, GX + 1, 0);
        aim.x = GX + 1; aim.z = 0;
      }

      function finish() {
        phase = 'done';
        var best = PIQ.saveBest('keeper', saves);
        if (saves >= 8) PIQ.award('keeper');
        PIQ.addXP(saves * 4);
        PIQ.markDay();
        PIQ.sfx.cheer();
        s.innerHTML = '<div class="eyebrow">Game over</div><h2>' + saves + ' / ' + SHOTS + ' saves</h2>' +
          '<p class="small">' + (best ? 'New best! ' : '') + '+' + saves * 4 + ' XP. ' + (saves >= 8 ? 'A wall of hands!' : 'Tip: watch the ball, then get on the line to the middle of the goal.') + '</p>' +
          '<div class="row"><button class="btn ghost" id="kp-back">Games</button><button class="btn" id="kp-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#kp-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.keeper.start(App, back); };
        s.querySelector('#kp-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      s.querySelector('#kp-go').onclick = function () { PIQ.sfx.tap(); PIQ.sfx.whistle(); shot(); };
    }
  };
})();

/* js/games/quizblitz.js */
/* Pitch IQ — Quiz Blitz: 10 quick questions, streak bonus. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  var COUNT = 10;

  PIQ.GAMES.quizblitz = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      // mix the topics: at most two questions from any one lesson
      var perLesson = {};
      var qs = PIQ.shuffle(PIQ.QUIZ).filter(function (q) {
        perLesson[q.lesson] = (perLesson[q.lesson] || 0) + 1;
        return perLesson[q.lesson] <= 2;
      }).slice(0, COUNT);
      var n = 0, right = 0, streak = 0, bestStreak = 0, pts = 0;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Quiz Blitz', back, '<span class="chip" id="qb-streak">Streak <b>0</b></span>');
      var s = App.sheet('', 'tall');
      var plain = { home: PIQ.SHAPES.midBall, away: PIQ.SHAPES.midBallAway, ball: 'CM', camera: { target: [0, 0], dist: 46, theta: 0.6, phi: 1.0, portraitDist: 70, portraitTheta: 0.6 } };

      function ask() {
        var q = qs[n];
        PIQ.buildScene(stage, q.scene || plain, { instantCamera: !q.scene });
        stage.autoSpin = q.scene ? 0 : 0.05;
        s.innerHTML = '<div class="row between"><div class="eyebrow">Question ' + (n + 1) + ' of ' + qs.length + '</div><span class="chip">' + pts + ' pts</span></div><div id="qb-box"></div>' +
          '<div class="row end" style="margin-top:12px"><button class="btn" id="qb-next" hidden>Next ' + I.next + '</button></div>';
        var box = s.querySelector('#qb-box');
        box._fit = s._fit;
        App.question(box, q, function (ok) {
          if (ok) {
            right++; streak++;
            pts += 10 + Math.min(streak - 1, 5) * 2;
            if (streak >= 3) App.bigmsg(streak + ' in a row!');
          } else streak = 0;
          bestStreak = Math.max(bestStreak, streak);
          if (streak >= 10) PIQ.award('quiz');
          document.getElementById('qb-streak').innerHTML = 'Streak <b>' + streak + '</b>';
          var nb = s.querySelector('#qb-next');
          nb.hidden = false;
          nb.innerHTML = n < qs.length - 1 ? 'Next ' + I.next : 'Finish ' + I.next;
          nb.onclick = function () { PIQ.sfx.tap(); n++; if (n < qs.length) ask(); else finish(); };
          s._fit();
        });
        s._fit();
      }

      function finish() {
        var best = PIQ.saveBest('quizblitz', pts);
        PIQ.addXP(right * 3);
        PIQ.markDay();
        PIQ.sfx.cheer();
        s.innerHTML = '<div class="eyebrow">Blitz done</div><h2>' + right + ' / ' + qs.length + ' right</h2>' +
          '<p>' + pts + ' points &middot; best streak ' + bestStreak + '</p>' +
          '<p class="small">' + (best ? 'New best score! ' : '') + '+' + right * 3 + ' XP. Every question links to an Academy lesson if you want to learn more.</p>' +
          '<div class="row"><button class="btn ghost" id="qb-back">Done</button><button class="btn" id="qb-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#qb-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.quizblitz.start(App, back); };
        s.querySelector('#qb-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      ask();
    }
  };
})();

/* js/board.js */
/* Pitch IQ — Tactics Board: drag anyone, pick a formation, and let
   "Auto shape" move both teams as the ball moves. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  var F = PIQ.FIELD;
  var AWAY_KEYS = { GK: 'GK', LD: 'D1', RD: 'D2', CD: 'D3', LW: 'M1', LM: 'M1', CM: 'M2', RW: 'M3', RM: 'M3', ST: 'F' };

  // where a team "should" be, in its own frame (attacking +x), for a ball at b
  function autoShape(base, b, have) {
    var out = {};
    var roles = Object.keys(base);
    roles.forEach(function (r) {
      var x = base[r][0], z = base[r][1];
      if (r === 'GK') {
        if (have) out[r] = [-F.L / 2 + PIQ.clamp(3 + (b[0] + 25) * 0.2, 2.5, 10), b[1] * 0.12];
        else out[r] = PIQ.keeperIdeal(b);
        return;
      }
      var nx, nz;
      if (have) {
        nx = x + b[0] * 0.7;
        nz = z + b[1] * 0.25;
        if (r === 'ST') nx = Math.max(nx, b[0] + 4);
        if ((r === 'LD' || r === 'RD' || r === 'CD') && b[0] > -12) nx = Math.min(nx, b[0] - 4);
      } else {
        nx = x * 0.7 + b[0] * 0.6 - 5;
        nz = z * 0.6 + b[1] * 0.45;
        if (r === 'ST') nx = PIQ.clamp(b[0] + 4, -5, 15);
        else nx = Math.min(nx, b[0] - 1.5);
      }
      out[r] = [PIQ.clamp(nx, -F.L / 2 + 3, F.L / 2 - 2), PIQ.clamp(nz, -F.W / 2 + 1.2, F.W / 2 - 1.2)];
    });
    if (!have) {
      // nearest field player presses from the goal-side
      var best = null, bd = 1e9;
      roles.forEach(function (r) { if (r !== 'GK') { var d = PIQ.dist(out[r], b); if (d < bd) { bd = d; best = r; } } });
      var gx = -F.L / 2 - b[0], gz = -b[1], gl = Math.sqrt(gx * gx + gz * gz) || 1;
      if (best) out[best] = [b[0] + gx / gl * 1.8, b[1] + gz / gl * 1.8];
    }
    return out;
  }

  PIQ.Board = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var cfg = { form: '2-3-1', have: true, auto: true, opp: true, draw: false };
      var selected = null, preview = null, p0 = null, lastAuto = 0;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Tactics Board', back);
      App.camDock(null);

      function homeBase() { return PIQ.FORMATIONS[cfg.form].shape; }
      function awayBase() {
        var b = PIQ.FORMATIONS['2-3-1'].shape, o = {};
        Object.keys(b).forEach(function (r) { o[AWAY_KEYS[r]] = b[r]; });
        return o;
      }
      function mirror(p) { return [-p[0], -p[1]]; }

      function setup() {
        var away = {};
        if (cfg.opp) {
          var ab = awayBase();
          Object.keys(ab).forEach(function (k) { away[k] = mirror(ab[k]); });
        }
        var cam = stage.lastPreset || 'broadcast';
        PIQ.buildScene(stage, { home: homeBase(), away: away, ball: [0, 0], camera: cam }, { keepCamera: true });
        var ids = stage.list.map(function (p) { return p.id; });
        stage.setDraggable(ids.concat(['ball']), true);
        stage.on('pick', function (p) {
          if (p.isBall) return;
          if (selected) selected.ring.visible = false;
          selected = p;
          PIQ.setRing(p, PIQ.COLORS.info, true);
          var eyes = document.getElementById('bd-eyes');
          if (eyes) eyes.disabled = false;
        });
        stage.on('dragMove', function (o) {
          if (!o.isBall || !cfg.auto) return;
          var now = Date.now();
          if (now - lastAuto < 140) return;
          lastAuto = now;
          applyAuto(0.7);
        });
        stage.on('dragEnd', function (o) { if (o.isBall && cfg.auto) applyAuto(0.7); });
        stage.on('groundDrag', cfg.draw ? drawHandler : null);
        if (cfg.auto) applyAuto(0.01);
      }

      function applyAuto(dur) {
        var b = stage.ball.pos;
        var h = autoShape(homeBase(), b, cfg.have);
        Object.keys(h).forEach(function (r) { if (stage.players[r]) stage.moveTo(r, h[r], dur); });
        if (cfg.opp) {
          var a = autoShape(awayBase(), mirror(b), !cfg.have);
          Object.keys(a).forEach(function (k) { if (stage.players['away:' + k]) stage.moveTo('away:' + k, mirror(a[k]), dur); });
        }
      }

      function drawHandler(g, phase, moved) {
        if (phase === 'start') { p0 = g; return; }
        if (!p0 || !g) return;
        if (preview) { stage.annot.remove(preview); preview = null; }
        if (PIQ.dist(p0, g) < 1) return;
        var a = stage.arrow(p0, g, 'run', { startCut: 0, endCut: 0 });
        if (phase === 'move') preview = a;
        else p0 = null;
      }

      var s = App.sheet(
        '<div class="toolbar" style="margin-bottom:8px">' +
          '<div class="seg" id="bd-form">' + Object.keys(PIQ.FORMATIONS).map(function (f) { return '<button data-f="' + f + '" class="' + (f === cfg.form ? 'on' : '') + '">' + f + '</button>'; }).join('') + '</div>' +
          '<div class="seg" id="bd-have"><button data-h="1" class="on">We have it</button><button data-h="0">They have it</button></div>' +
        '</div>' +
        '<div class="toolbar">' +
          '<button class="btn small chalk" id="bd-auto">Auto shape: on</button>' +
          '<button class="btn small ghost" id="bd-opp">Opponents: on</button>' +
          '<button class="btn small ghost" id="bd-draw">Draw runs: off</button>' +
          '<button class="btn small ghost" id="bd-eyes" disabled>' + I.eye + ' Her eyes</button>' +
          '<button class="btn small ghost" id="bd-clear">Clear runs</button>' +
          '<button class="btn small ghost" id="bd-reset">' + I.replay + ' Reset</button>' +
        '</div>' +
        '<p class="small" style="margin:10px 0 0">Drag any player or the ball. With <b>Auto shape</b> on, drag the ball and watch both teams move. Tap a player, then <b>Her eyes</b> to see what she sees. Spin and pinch the field to look around.</p>', 'mini');

      s.querySelector('#bd-form').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-f]') : null;
        if (!b) return;
        PIQ.sfx.tap();
        cfg.form = b.getAttribute('data-f');
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        setup();
      };
      s.querySelector('#bd-have').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-h]') : null;
        if (!b) return;
        PIQ.sfx.tap();
        cfg.have = b.getAttribute('data-h') === '1';
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        if (cfg.auto) applyAuto(0.9);
      };
      function toggle(id, key, label, onChange) {
        var b = s.querySelector(id);
        b.onclick = function () {
          PIQ.sfx.tap();
          cfg[key] = !cfg[key];
          b.textContent = label + ': ' + (cfg[key] ? 'on' : 'off');
          b.className = 'btn small ' + (cfg[key] ? 'chalk' : 'ghost');
          if (onChange) onChange();
        };
      }
      toggle('#bd-auto', 'auto', 'Auto shape', function () { if (cfg.auto) applyAuto(0.9); });
      toggle('#bd-opp', 'opp', 'Opponents', setup);
      toggle('#bd-draw', 'draw', 'Draw runs', function () { stage.on('groundDrag', cfg.draw ? drawHandler : null); });
      s.querySelector('#bd-draw').className = 'btn small ghost';
      s.querySelector('#bd-eyes').onclick = function () {
        if (!selected) return;
        PIQ.sfx.tap();
        if (stage.pov) stage.setCamera(stage.lastPreset || 'broadcast');
        else stage.setPOV(selected.id);
      };
      s.querySelector('#bd-clear').onclick = function () { PIQ.sfx.tap(); stage.clearAnnotations(); };
      s.querySelector('#bd-reset').onclick = function () { PIQ.sfx.tap(); selected = null; stage.setCamera('broadcast'); setup(); };

      stage.setCamera('broadcast');
      setup();
      PIQ.markDay();
    }
  };
})();

    PIQ.TEAMS.home.shirt = j.shirt; PIQ.TEAMS.home.socks = j.shirt; PIQ.TEAMS.home.shorts = j.shorts;

    PIQ.TEAMS.home.keeper = state.jersey === 'teal' ? 0xffd23f : 0x19c37d;

  }
  PIQ.teamText = function (html) { return html.replace(/\bblue\b/g, PIQ.teamWord || 'blue'); };
  function hexCss(c) { return '#' + ('000000' + c.toString(16)).slice(-6); }

  // ---------- UI helpers ----------
  var ui, stage, current = null;
  function clearUI() { ui.innerHTML = ''; }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

  var App = {
    ICONS: I,
    el: el,
    stage: function () { return stage; },
    // leave whatever screen is running
    leave: function () {
      if (current && current.destroy) current.destroy();
      current = null;
      stage.speedScale = 1;
      stage.setInset(0, 0);
