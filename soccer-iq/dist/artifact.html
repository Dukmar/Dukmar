/* js/games/decide.js */
/* Pitch IQ — Pass, Dribble or Shoot? You have the ball: pick an option. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  // No clock by default: she needs time to spin the field and look around before deciding.
  // "Beat the clock" is an opt-in challenge with a generous 30 seconds.
  var TIME = 30;

  function optLabel(o) {
    var R = PIQ.ROLES;
    if (o.type === 'shoot') return 'Shoot!';
    if (o.type === 'dribble') return 'Dribble into the open grass';
    if (o.type === 'clear') return 'Kick it out of play';
    if (o.type === 'punt') return 'Kick it long';
    if (o.runner) return 'Pass ahead of the ' + R[o.runner].name.toLowerCase() + ' so she can run onto it';
    var who = R[o.to] ? R[o.to].name.toLowerCase() : 'teammate';
    return 'Pass to the ' + (o.to === 'GK' ? 'keeper' : who);
  }

  PIQ.decideLabel = optLabel;

  PIQ.GAMES.decide = {
    start: function (App, back) {
      var stage = App.stage();
      var round = PIQ.shuffle(PIQ.DECISIONS).slice(0, 6);
      var idx = 0, score = 0, streak = 0;
      var I = App.ICONS;
      var timerId = null;

      App.leave();
      App.setCurrent({ destroy: function () { if (timerId) clearInterval(timerId); } });
      App.topbar('Pass, Dribble or Shoot?', back, '<span class="chip" id="dc-score"><b>0</b> pts</span>');
      App.camDock(null);
      var timed = !!PIQ.profile().settings.clock;
      var timerBar = App.el('<div class="timer"' + (timed ? '' : ' hidden') + '><i style="width:100%"></i></div>');
      document.getElementById('ui').appendChild(timerBar);
      var s = App.sheet('', 'mini');

      function where(o) {
        if (o.type === 'shoot') return o.target ? [o.target[0] - 1.4, o.target[1]] : [23.6, 0];
        if (o.type === 'pass' && !o.runner) return PIQ.pt(stage, o.to);
        return o.to;
      }

      function play() {
        var sc = round[idx];
        PIQ.buildScene(stage, { home: sc.scene.home, away: sc.scene.away, ball: sc.scene.ball, you: sc.you, camera: sc.scene.camera }, { instantCamera: true });
        var opts = PIQ.shuffle(sc.options).map(function (o, i) { var c = {}; for (var k in o) c[k] = o[k]; c.key = 'ABC'[i]; return c; });
        opts.forEach(function (o) {
          var w = where(o);
          if (o.type === 'dribble' || o.runner) stage.zone(w, 1.6, { color: PIQ.COLORS.zone, pulse: true });
          stage.label(o.type === 'pass' && !o.runner ? o.to : w, o.key, 'opt', o.type === 'pass' && !o.runner ? {} : { y: 0.8 });
        });
        var answered = false;
        stage.after(0.5, function () { PIQ.chat(stage, 'decideStart'); });
        s.innerHTML = '<div class="eyebrow">Decision ' + (idx + 1) + ' of ' + round.length + '</div><p class="caption">' + sc.prompt + '</p>' +
          '<div class="answers">' + opts.map(function (o) { return '<button class="answer" data-k="' + o.key + '"><span class="k">' + o.key + '</span><span>' + optLabel(o) + '</span></button>'; }).join('') + '</div>';
        s._fit();
        var t0 = Date.now();
        if (timerId) clearInterval(timerId);
        if (timed) timerId = setInterval(function () {
          var left = 1 - (Date.now() - t0) / (TIME * 1000);
          timerBar.firstChild.style.width = Math.max(0, left * 100) + '%';
          if (left <= 0) { clearInterval(timerId); timerId = null; if (!answered) choose(null); }
        }, 100);
        s.querySelector('.answers').addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('.answer') : null;
          if (b) choose(opts.filter(function (o) { return o.key === b.getAttribute('data-k'); })[0]);
        });
        // tap the receiver or the space on the field too
        stage.on('pick', function (p) {
          var o = opts.filter(function (x) { return x.type === 'pass' && !x.runner && x.to === p.id; })[0];
          if (o) choose(o);
        });
        stage.on('ground', function (g) {
          var best = null, bd = 3;
          opts.forEach(function (o) { var d = PIQ.dist(g, where(o)); if (d < bd) { bd = d; best = o; } });
          if (best) choose(best);
        });

        function choose(o) {
          if (answered) return;
          answered = true;
          if (timerId) { clearInterval(timerId); timerId = null; }
          var secs = (Date.now() - t0) / 1000;
          var pts = 0;
          stage.clearLabels(true); stage.clearAnnotations();
          if (!o) {
            streak = 0;
            PIQ.sfx.bad();
            App.bigmsg('Too slow!');
            o = opts.filter(function (x) { return x.grade === 'best'; })[0];
            act(o);
            feedback(o, 0, 'Out of time! Here\'s the best choice.');
            return;
          }
          var quick = timed && secs < 10;
          if (o.grade === 'best') { pts = 3 + (quick ? 1 : 0); streak++; PIQ.sfx.good(); App.bigmsg(quick ? 'Quick &amp; smart!' : 'Smart!'); }
          else if (o.grade === 'ok') { pts = 1; streak = 0; PIQ.sfx.ok(); }
          else { streak = 0; PIQ.sfx.bad(); }
          if (streak >= 5) PIQ.award('decider');
          score += pts;
          var speaker = o.type === 'pass' && !o.runner ? o.to : o.runner || null;
          stage.after(0.9, function () { PIQ.chat(stage, o.grade === 'best' ? 'decideBest' : o.grade === 'ok' ? 'decideOk' : 'decideBad', o.grade === 'bad' ? null : speaker); });
          if (o.grade === 'best') stage.after(0.9, function () { stage.cheer(); });
          document.getElementById('dc-score').innerHTML = '<b>' + score + '</b> pts';
          act(o);
          var bestO = opts.filter(function (x) { return x.grade === 'best'; })[0];
          feedback(o, pts, o.grade === 'best' ? '' : 'Best choice: <b>' + bestO.key + '. ' + optLabel(bestO) + '</b>.');
        }

        function act(o) {
          var you = stage.players[sc.you];
          var target = where(o);
          if (o.type === 'pass' && !o.runner) {
            stage.kickBall(PIQ.pt(stage, o.to), { owner: o.to });
          } else if (o.runner) {
            stage.kickBall(o.to, { dur: 1.1 });
            stage.moveTo(o.runner, o.to, 1.1);
            stage.after(1.15, function () { stage.giveBall(o.runner); });
          } else if (o.type === 'dribble') {
            stage.giveBall(sc.you); you.faceBall = false;
            stage.moveTo(sc.you, o.to, 1.4);
          } else if (o.type === 'shoot') {
            var aim = o.target || [25.6, (Math.random() - 0.5) * 3];
            var blocked = o.grade === 'bad';
            stage.kickBall(blocked ? target : aim, { height: blocked ? 0.2 : 0.5, dur: 0.7, onDone: function () { if (!blocked) PIQ.sfx.cheer(); } });
          } else {
            stage.kickBall(o.to, { height: 4, dur: 1.4 });
          }
          if (o.grade !== 'bad') {
            stage.zone(o.type === 'pass' && !o.runner ? PIQ.pt(stage, o.to) : target, 1.4, { color: PIQ.COLORS.good });
          }
        }

        function feedback(o, pts, extra) {
          s.innerHTML = '<div class="row between"><div class="eyebrow">' + (o.grade === 'best' ? 'Great choice' : o.grade === 'ok' ? 'Not bad' : 'Hmm') + '</div><span class="chip">+' + pts + '</span></div>' +
            '<p class="caption">' + o.why + (extra ? ' ' + extra : '') + '</p>' +
            '<div class="row end"><button class="btn" id="dc-next">' + (idx < round.length - 1 ? 'Next ' : 'Finish ') + I.next + '</button></div>';
          s._fit();
          s.querySelector('#dc-next').onclick = function () {
            PIQ.sfx.tap();
            idx++;
            if (idx < round.length) play(); else finish();
          };
        }
      }

      function finish() {
        timerBar.firstChild.style.width = '0%';
        var best = PIQ.saveBest('decide', score);
        PIQ.addXP(score * 2);
        PIQ.markDay();
        PIQ.sfx.cheer();
        stage.clearAnnotations(); stage.clearLabels();
        s.innerHTML = '<div class="eyebrow">Round done</div><h2>' + score + ' points</h2>' +
          '<p class="small">' + (best ? 'New best! ' : '') + '+' + score * 2 + ' XP. The best choice scores 3.' + (timed ? ' With the clock on, a best choice in under 10 seconds scores 4.' : '') + '</p>' +
          '<div class="row"><button class="btn ghost" id="dc-back">Games</button><button class="btn" id="dc-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#dc-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.decide.start(App, back); };
        s.querySelector('#dc-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      // start screen: take your time (default) or beat the clock
      PIQ.buildScene(stage, round[0].scene, { instantCamera: true });
      s.innerHTML = '<div class="eyebrow">Pass, Dribble or Shoot?</div><p class="caption">You have the ball. Look around the field, then pick the smartest play.</p>' +
        '<p class="small">Spin the field with your finger (or the mouse) to see where everyone is.</p>' +
        '<div class="row" style="margin:8px 0 12px"><span class="grow">Clock</span><div class="seg" id="dc-clock"><button data-c="0" class="' + (timed ? '' : 'on') + '">Take your time</button><button data-c="1" class="' + (timed ? 'on' : '') + '">Beat the clock (30 s)</button></div></div>' +
        '<div class="row end"><button class="btn" id="dc-go">Start ' + I.next + '</button></div>';
      s._fit();
      s.querySelector('#dc-clock').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-c]') : null;
        if (!b) return;
        PIQ.sfx.tap();
        timed = b.getAttribute('data-c') === '1';
        PIQ.profile().settings.clock = timed;
        PIQ.saveProfile();
        timerBar.hidden = !timed;
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
      };
      s.querySelector('#dc-go').onclick = function () { PIQ.sfx.tap(); play(); };
    }
  };
})();

/* js/games/keeper.js */
/* Pitch IQ — Keeper Hero: move the keeper to the right angle before the shot. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  var F = PIQ.FIELD;
  var GX = -F.L / 2;          // our goal line
  var POST = F.goalW / 2;
  var SHOTS = 10;

  // the spot a keeper should take: on the ball-to-centre line, a few steps out
  function idealSpot(ball) {
    var dx = ball[0] - GX, dz = ball[1];
    var d = Math.sqrt(dx * dx + dz * dz);
    var out = PIQ.clamp(d * 0.25, 1.5, 3.5);
    return [GX + dx / d * out, dz / d * out];
  }
  PIQ.keeperIdeal = idealSpot;

  PIQ.GAMES.keeper = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var n = 0, saves = 0, phase = 'idle', alive = true;

      App.leave();
      App.setCurrent({ destroy: function () { alive = false; } });
      App.topbar('Keeper Hero', back, '<span class="chip" id="kp-score">Saves <b>0</b></span>');
      var s = App.sheet('<div class="eyebrow">You\'re the keeper</div><p class="caption">The attacker dribbles, then shoots. <b>Drag anywhere</b> on the field to move' + (PIQ.hasKeys ? ' (or use the arrow keys)' : '') + '. Stand between the ball and the middle of the goal, a few steps out from the goal line.</p>' +
        '<div class="row end"><button class="btn" id="kp-go">Start ' + I.next + '</button></div>', 'mini');

      PIQ.buildScene(stage, {
        home: { GK: [-24, 0], LD: [-16, -9], RD: [-15, 9] },
        away: { F: [-10, 4] },
        ball: 'away:F', you: 'GK',
        camera: { target: [-15, 0], dist: 20, theta: -Math.PI / 2 + 0.0001, phi: 1.0, portraitDist: 30, portraitTheta: -Math.PI / 2 }
      });
      var gk = stage.players.GK, att = stage.players['away:F'];
      gk.faceBall = true;
      var aim = { x: gk.pos[0], z: gk.pos[1] };
      function steer(g) {
        if (!g || phase === 'idle' || phase === 'done') return;
        aim.x = PIQ.clamp(g[0], GX + 0.3, GX + 10);
        aim.z = PIQ.clamp(g[1], -9, 9);
      }
      stage.on('groundDrag', function (g) { steer(g); });
      stage.on('ground', function (g) { steer(g); });
      // arrow keys move the keeper directly; keep the finger target in step
      stage.keyPlayer = 'GK';
      stage.on('keyMove', function () { aim.x = PIQ.clamp(gk.pos[0], GX + 0.3, GX + 10); aim.z = PIQ.clamp(gk.pos[1], -9, 9); });
      stage.on('enter', function () { var b = document.getElementById('kp-next') || document.getElementById('kp-go'); if (b) b.click(); });

      // keeper chases the finger at a keeper's speed
      var lastT = Date.now();
      var speedTimer = setInterval(function () {
        if (!alive) { clearInterval(speedTimer); return; }
        var now = Date.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
        if (phase === 'idle' || phase === 'done') return;
        if (stage.keys && (stage.keys.up || stage.keys.down || stage.keys.left || stage.keys.right)) return;
        var dx = aim.x - gk.pos[0], dz = aim.z - gk.pos[1];
        var d = Math.sqrt(dx * dx + dz * dz);
        var max = 6.5 * dt;
        if (d > 0.02) {
          var k = Math.min(1, max / d);
          PIQ.setPlayerPos(gk, gk.pos[0] + dx * k, gk.pos[1] + dz * k);
          gk.speed = d > 0.1 ? 5 : 0; gk._dragSpeedT = 0.1;
          gk.heading = Math.atan2(dx, dz);
        }
      }, 16);

      function score() { var c = document.getElementById('kp-score'); if (c) c.innerHTML = 'Saves <b>' + saves + '</b> / ' + n; }

      function shot() {
        if (!alive) return;
        n++;
        phase = 'dribble';
        stage.clearAnnotations(); stage.clearLabels(true);
        var spot = [PIQ.lerp(-17, -9, Math.random()), (Math.random() * 2 - 1) * 11];
        if (Math.abs(spot[1]) > 7 && spot[0] < -14) spot[0] = -12;
        var speed = 2.8 + n * 0.3; // first shots come slowly so she has time to get set
        var dur = Math.max(0.9, PIQ.dist(att.pos, spot) / speed);
        stage.giveBall('away:F');
        att.faceBall = false;
        stage.moveTo('away:F', spot, dur);
        s.innerHTML = '<div class="eyebrow">Shot ' + n + ' of ' + SHOTS + '</div><p class="caption">Get between the ball and the middle of the goal!</p>';
        s._fit();
        stage.after(dur + 1.1 - Math.min(0.5, n * 0.05), function () { take(spot); });
      }

      function take(ball) {
        if (!alive) return;
        phase = 'shot';
        // the shooter aims at the side the keeper leaves open
        var sides = [-POST + 0.35, POST - 0.35].map(function (z) {
          return { z: z, gap: PIQ.segDist(gk.pos, ball, [GX, z]) };
        }).sort(function (a, b) { return b.gap - a.gap; });
        var pick = Math.random() < 0.8 ? sides[0] : sides[1];
        var keeperOut = gk.pos[0] - GX;
        var chip = keeperOut > 7;
        var target = [GX - 0.6, pick.z];
        var gap = PIQ.segDist(gk.pos, ball, target);
        var saved = !chip && gap < 2.1; // forgiving reach: within ~0.5 m of the textbook spot saves about 9 in 10
        att.heading = Math.atan2(target[0] - att.pos[0], target[1] - att.pos[1]);
        att.obj.rotation.y = att.heading;
        stage._carryBall();
        var ideal = idealSpot(ball);
        var hit = saved ? [gk.pos[0] + (ball[0] - gk.pos[0]) * 0.08, gk.pos[1] + (ball[1] - gk.pos[1]) * 0.08] : target;
        stage.kickBall(hit, { height: chip ? 2.6 : 0.45, dur: chip ? 1 : 0.55, onDone: function () {
          if (!alive) return;
          phase = 'done';
          if (saved) {
            saves++;
            // a little dive toward the shot
            var side = PIQ.segDist([gk.pos[0], gk.pos[1] + 0.5], ball, target) < gap ? 1 : -1;
            gk.body.rotation.z = -side * 0.9;
            stage.after(0.7, function () { gk.body.rotation.z = 0; });
            stage.giveBall('GK');
            PIQ.sfx.good();
            stage.cheer();
            PIQ.chat(stage, 'keeperSave', null, 3);
            App.bigmsg(PIQ.pick(['Save!', 'Great hands!', 'Denied!']));
          } else {
            PIQ.sfx.bad();
            PIQ.chat(stage, 'keeperGoal', null, 3);
            App.bigmsg('Goal');
          }
          score();
          var off = PIQ.dist(gk.pos, ideal);
          stage.zone(ideal, 0.9, { color: PIQ.COLORS.good, pulse: true });
          stage.arrow(ball, [GX, -POST], 'pass', { color: PIQ.COLORS.bad, startCut: 0.5, endCut: 0 });
          stage.arrow(ball, [GX, POST], 'pass', { color: PIQ.COLORS.bad, startCut: 0.5, endCut: 0 });
          var tip = chip ? 'You came out too far and she chipped it over you. Stay a few steps out from the goal line.'
            : saved ? (off < 1.2 ? 'Perfect spot!' : 'Saved! The green circle shows the very best spot.')
            : off > 1.2 ? 'The green circle shows the best spot: on the line from the ball to the middle of the goal.'
            : 'Good spot, but she found the corner. Keep your feet set before the shot!';
          s.innerHTML = '<div class="eyebrow">Shot ' + n + ' of ' + SHOTS + '</div><p class="caption">' + tip + '</p>' +
            '<div class="row end"><button class="btn" id="kp-next">' + (n < SHOTS ? 'Next shot ' : 'Finish ') + I.next + '</button></div>';
          s._fit();
          s.querySelector('#kp-next').onclick = function () {
            PIQ.sfx.tap();
            if (n < SHOTS) { reset(); shot(); } else finish();
          };
        } });
      }

      function reset() {
        stage.finishAll();
        var b = stage.ball.pos.slice();
        stage.giveBall('away:F');
        PIQ.setPlayerPos(att, b[0] > GX + 3 ? att.pos[0] : -10, att.pos[1]);
        PIQ.setPlayerPos(gk, GX + 1, 0);
        aim.x = GX + 1; aim.z = 0;
      }

      function finish() {
        phase = 'done';
        stage.keyPlayer = null;
        var best = PIQ.saveBest('keeper', saves);
        if (saves >= 8) PIQ.award('keeper');
        PIQ.addXP(saves * 4);
        PIQ.markDay();
        PIQ.sfx.cheer();
        s.innerHTML = '<div class="eyebrow">Game over</div><h2>' + saves + ' / ' + SHOTS + ' saves</h2>' +
          '<p class="small">' + (best ? 'New best! ' : '') + '+' + saves * 4 + ' XP. ' + (saves >= 8 ? 'A wall of hands!' : 'Tip: watch the ball, then get on the line to the middle of the goal.') + '</p>' +
          '<div class="row"><button class="btn ghost" id="kp-back">Games</button><button class="btn" id="kp-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#kp-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.keeper.start(App, back); };
        s.querySelector('#kp-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      s.querySelector('#kp-go').onclick = function () { PIQ.sfx.tap(); PIQ.sfx.whistle(); shot(); };
      stage.after(0.6, function () { PIQ.chat(stage, 'keeperStart'); });
    }
  };
})();

/* js/games/quizblitz.js */
/* Pitch IQ — Quiz Blitz: 10 quick questions, streak bonus. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};
  var COUNT = 10;

  PIQ.GAMES.quizblitz = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      // mix the topics: at most two questions from any one lesson
      var perLesson = {};
      var qs = PIQ.shuffle(PIQ.QUIZ).filter(function (q) {
        perLesson[q.lesson] = (perLesson[q.lesson] || 0) + 1;
        return perLesson[q.lesson] <= 2;
      }).slice(0, COUNT);
      var n = 0, right = 0, streak = 0, bestStreak = 0, pts = 0;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Quiz Blitz', back, '<span class="chip" id="qb-streak">Streak <b>0</b></span>');
      var s = App.sheet('', 'tall');
      var plain = { home: PIQ.SHAPES.midBall, away: PIQ.SHAPES.midBallAway, ball: 'CM', camera: { target: [0, 0], dist: 46, theta: 0.6, phi: 1.0, portraitDist: 70, portraitTheta: 0.6 } };

      function ask() {
        var q = qs[n];
        PIQ.buildScene(stage, q.scene || plain, { instantCamera: !q.scene });
        stage.autoSpin = q.scene ? 0 : 0.05;
        s.innerHTML = '<div class="row between"><div class="eyebrow">Question ' + (n + 1) + ' of ' + qs.length + '</div><span class="chip">' + pts + ' pts</span></div><div id="qb-box"></div>' +
          '<div class="row end" style="margin-top:12px"><button class="btn" id="qb-next" hidden>Next ' + I.next + '</button></div>';
        var box = s.querySelector('#qb-box');
        box._fit = s._fit;
        App.question(box, q, function (ok) {
          PIQ.chat(stage, ok ? 'quizRight' : 'quizWrong');
          if (ok) {
            right++; streak++;
            pts += 10 + Math.min(streak - 1, 5) * 2;
            if (streak >= 3) App.bigmsg(streak + ' in a row!');
          } else streak = 0;
          bestStreak = Math.max(bestStreak, streak);
          if (streak >= 10) PIQ.award('quiz');
          document.getElementById('qb-streak').innerHTML = 'Streak <b>' + streak + '</b>';
          var nb = s.querySelector('#qb-next');
          nb.hidden = false;
          nb.innerHTML = n < qs.length - 1 ? 'Next ' + I.next : 'Finish ' + I.next;
          nb.onclick = function () { PIQ.sfx.tap(); n++; if (n < qs.length) ask(); else finish(); };
          s._fit();
        });
        s._fit();
      }

      function finish() {
        var best = PIQ.saveBest('quizblitz', pts);
        PIQ.addXP(right * 3);
        PIQ.markDay();
        PIQ.sfx.cheer();
        s.innerHTML = '<div class="eyebrow">Blitz done</div><h2>' + right + ' / ' + qs.length + ' right</h2>' +
          '<p>' + pts + ' points &middot; best streak ' + bestStreak + '</p>' +
          '<p class="small">' + (best ? 'New best score! ' : '') + '+' + right * 3 + ' XP. Every question links to an Academy lesson if you want to learn more.</p>' +
          '<div class="row"><button class="btn ghost" id="qb-back">Done</button><button class="btn" id="qb-again">' + I.replay + ' Play again</button></div>';
        s._fit();
        s.querySelector('#qb-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.quizblitz.start(App, back); };
        s.querySelector('#qb-back').onclick = function () { PIQ.sfx.tap(); back(); };
      }

      ask();
    }
  };
})();

/* js/games/moments.js */
/* Pitch IQ — "moments": single challenges borrowed from every game, used by
   Match Day and the Daily Challenge. Each moment ends by calling
   done(result, why) with result 'best' | 'ok' | 'bad'. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  var S = PIQ.SHAPES;
  var GX = -PIQ.FIELD.L / 2, POST = PIQ.FIELD.goalW / 2;

  var ATTACK_SCENE = { home: S.attBall, away: S.attBallAway, ball: 'RW', camera: { target: [12, 0], dist: 36, theta: 0.15, phi: 0.95 } };
  var DEFEND_SCENE = { home: S.defMid, away: S.defMidAway, ball: 'away:M1', camera: { target: [-6, 2], dist: 36, theta: 0.15, phi: 0.95 } };
  var ATTACK_LESSONS = /^(field|shape|attack|switch-1|restarts)/;
  var DEFEND_LESSONS = /^(defend|switch-2|keeper)/;
  var ATTACK_SPOTS = ['so1', 'so2', 'so4', 'so6', 'so7', 'so11', 'so12', 'so15'];
  var DEFEND_SPOTS = ['so8', 'so9', 'so10', 'so13', 'so14'];

  // a small seeded random so the Daily Challenge is the same all day
  PIQ.seeded = function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  function pickFrom(list, used, rnd) {
    var free = list.filter(function (x) { return !used[x.id]; });
    if (!free.length) free = list;
    var it = free[Math.floor((rnd || Math.random)() * free.length)];
    used[it.id] = true;
    return it;
  }

  // kind: quiz | decide | spoton | mistake | keeper ; side: attack | defend
  function pick(kind, side, used, rnd) {
    if (kind === 'quiz') {
      var re = side === 'attack' ? ATTACK_LESSONS : side === 'defend' ? DEFEND_LESSONS : /./;
      return { kind: kind, side: side, q: pickFrom(PIQ.QUIZ.filter(function (q) { return re.test(q.lesson); }), used, rnd) };
    }
    if (kind === 'decide') return { kind: kind, side: 'attack', sc: pickFrom(PIQ.DECISIONS, used, rnd) };
    if (kind === 'mistake') return { kind: kind, side: side, sc: pickFrom(PIQ.MISTAKES, used, rnd) };
    if (kind === 'spoton') {
      var ids = side === 'defend' ? DEFEND_SPOTS : side === 'attack' ? ATTACK_SPOTS : ATTACK_SPOTS.concat(DEFEND_SPOTS);
      return { kind: kind, side: side, sc: pickFrom(PIQ.SPOTON.filter(function (s) { return ids.indexOf(s.id) >= 0; }), used, rnd) };
    }
    var r = rnd || Math.random;
    return { kind: 'keeper', side: 'defend', id: 'k' + Math.floor(r() * 1e6), spot: [PIQ.lerp(-17, -10, r()), (r() * 2 - 1) * 10] };
  }

  function run(ctx, m, done) {
    var App = ctx.App, stage = ctx.stage, s = ctx.sheet, I = App.ICONS;
    var head = '<div class="eyebrow">' + ctx.eyebrow + '</div>';
    var finished = false;
    function finish(result, why) {
      if (finished) return;
      finished = true;
      stage.keyPlayer = null;
      stage.on('enter', null);
      done(result, why);
    }
    var keysHint = PIQ.hasKeys ? ' Arrow keys work too.' : '';

    if (m.kind === 'quiz') {
      PIQ.buildScene(stage, m.q.scene || (m.side === 'defend' ? DEFEND_SCENE : ATTACK_SCENE), { instantCamera: true });
      s.innerHTML = head + '<div id="mm-box"></div><div id="mm-foot"></div>';
      var box = s.querySelector('#mm-box');
      box._fit = s._fit;
      App.question(box, m.q, function (ok) { finish(ok ? 'best' : 'bad', ''); });
      s._fit();
      return;
    }

    if (m.kind === 'decide') {
      var sc = m.sc;
      PIQ.buildScene(stage, { home: sc.scene.home, away: sc.scene.away, ball: sc.scene.ball, you: sc.you, camera: sc.scene.camera }, { instantCamera: true });
      var where = function (o) {
        if (o.type === 'shoot') return o.target ? [o.target[0] - 1.4, o.target[1]] : [23.6, 0];
        if (o.type === 'pass' && !o.runner) return PIQ.pt(stage, o.to);
        return o.to;
      };
      var opts = PIQ.shuffle(sc.options).map(function (o, i) { var c = {}; for (var k in o) c[k] = o[k]; c.key = 'ABC'[i]; return c; });
      opts.forEach(function (o) {
        var w = where(o);
        if (o.type === 'dribble' || o.runner) stage.zone(w, 1.6, { color: PIQ.COLORS.zone, pulse: true });
        stage.label(o.type === 'pass' && !o.runner ? o.to : w, o.key, 'opt', o.type === 'pass' && !o.runner ? {} : { y: 0.8 });
      });
      s.innerHTML = head + '<p class="caption">' + sc.prompt + '</p><div class="answers">' +
        opts.map(function (o) { return '<button class="answer" data-k="' + o.key + '"><span class="k">' + o.key + '</span><span>' + PIQ.decideLabel(o) + '</span></button>'; }).join('') + '</div><div id="mm-foot"></div>';
      s._fit();
      var answers = s.querySelector('.answers');
      answers.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.answer') : null;
        if (!b || answers.classList.contains('locked')) return;
        answers.classList.add('locked');
        var o = opts.filter(function (x) { return x.key === b.getAttribute('data-k'); })[0];
        b.classList.add(o.grade === 'bad' ? 'wrong' : 'right');
        stage.clearLabels(true); stage.clearAnnotations();
        if (o.type === 'pass' && !o.runner) stage.kickBall(PIQ.pt(stage, o.to), { owner: o.to });
        else if (o.runner) { stage.kickBall(o.to, { dur: 1.1, owner: null }); stage.moveTo(o.runner, o.to, 1.1); stage.after(1.15, function () { stage.giveBall(o.runner); }); }
        else if (o.type === 'dribble') { stage.giveBall(sc.you); stage.moveTo(sc.you, o.to, 1.3); }
        else if (o.type !== 'shoot') stage.kickBall(o.to, { height: 4, dur: 1.3 });
        if (o.grade === 'best') PIQ.sfx.good(); else if (o.grade === 'ok') PIQ.sfx.ok(); else PIQ.sfx.bad();
        var bestO = opts.filter(function (x) { return x.grade === 'best'; })[0];
        stage.after(o.type === 'shoot' ? 0.1 : 1.4, function () {
          finish(o.type === 'shoot' && o.grade === 'best' ? 'best' : o.grade, o.why + (o.grade === 'best' ? '' : ' Best choice: <b>' + PIQ.decideLabel(bestO) + '</b>.'));
        });
      });
      return;
    }

    if (m.kind === 'spoton') {
      var so = m.sc;
      PIQ.buildScene(stage, { home: so.scene.home, away: so.scene.away, ball: so.scene.ball, you: so.you, youAt: so.youAt, camera: so.scene.camera }, { instantCamera: true });
      stage.setDraggable([so.you], true);
      stage.keyPlayer = so.you;
      var locked = false;
      stage.on('ground', function (g) { if (!locked) stage.moveTo(so.you, g, 0.5); });
      s.innerHTML = head + '<p class="caption">' + so.prompt + '</p><p class="small">Drag yourself or tap the field, then lock it in.' + keysHint + '</p>' +
        '<div class="row end"><button class="btn" id="mm-lock">Lock it in</button></div><div id="mm-foot"></div>';
      s._fit();
      var lock = function () {
        if (locked) return;
        locked = true;
        stage.setDraggable([so.you], false);
        stage.finishAll();
        var me = stage.players[so.you];
        var gap = PIQ.zoneGap(so.target, me.pos);
        var stars = gap <= 0.01 ? 3 : gap <= 2.5 ? 2 : gap <= 6 ? 1 : 0;
        if (so.target.rect) stage.zone(so.target.rect, null, { color: PIQ.COLORS.good, opacity: 0.25 });
        else stage.zone(so.target.at, so.target.r, { color: PIQ.COLORS.good, opacity: 0.25, pulse: true });
        if (stars < 3) stage.label(so.best, 'Best spot', 'good', { y: 0.4 });
        if (stars < 2) stage.moveTo(so.you, so.best, 1);
        if (stars >= 2) PIQ.sfx.good(); else PIQ.sfx.bad();
        var btn = s.querySelector('#mm-lock'); if (btn) btn.parentNode.removeChild(btn);
        // pass to her if she's in the spot (the match may then turn it into a goal)
        stage.after(stars >= 2 ? 0.3 : 1.2, function () {
          var owner = stage.ball.owner;
          if (owner && owner.id !== so.you && owner.team === 'home' && stars >= 2) stage.kickBall(PIQ.pt(stage, so.you), { owner: so.you });
        });
        stage.after(1.3, function () { finish(stars === 3 ? 'best' : stars === 2 ? 'ok' : 'bad', App.stars(stars) + ' ' + so.explain); });
      };
      s.querySelector('#mm-lock').onclick = lock;
      stage.on('enter', lock);
      return;
    }

    if (m.kind === 'mistake') {
      var mk = m.sc;
      PIQ.buildScene(stage, mk.scene, { instantCamera: true });
      s.innerHTML = head + '<p class="caption">' + PIQ.teamText(mk.prompt) + '</p><p class="small">Tap one of our players.</p><div id="mm-foot"></div>';
      s._fit();
      var answered = false;
      stage.on('pick', function (p) {
        if (answered || p.isBall) return;
        if (p.team !== 'home') { PIQ.toast('Look at <b>our</b> team: the ' + (PIQ.teamWord || 'blue') + ' shirts.'); return; }
        answered = true;
        var ok = p.id === mk.wrong;
        var w = stage.players[mk.wrong];
        PIQ.setRing(w, PIQ.COLORS.bad, true);
        if (ok) { PIQ.sfx.good(); PIQ.chat(stage, 'mistakeFound', mk.wrong, 3); }
        else { PIQ.sfx.bad(); PIQ.chat(stage, 'mistakeNotMe', p.id, 2.5); }
        stage.after(0.8, function () { stage.moveTo(mk.wrong, mk.fix, 1.2); });
        stage.after(2.1, function () { PIQ.setRing(w, PIQ.COLORS.good, true); finish(ok ? 'best' : 'bad', PIQ.teamText(mk.explain)); });
      });
      return;
    }

    // keeper: one shot, get your angle right first
    PIQ.buildScene(stage, {
      home: { GK: [GX + 1, 0], LD: [-16, -9], RD: [-15, 9] },
      away: { F: m.spot.slice() },
      ball: 'away:F', you: 'GK',
      camera: { target: [-15, 0], dist: 20, theta: -Math.PI / 2 + 0.0001, phi: 1.0, portraitDist: 30, portraitTheta: -Math.PI / 2 }
    }, { instantCamera: true });
    var gk = stage.players.GK;
    gk.faceBall = true;
    stage.keyPlayer = 'GK';
    var steer = function (g) {
      if (!g) return;
      stage.moveTo('GK', [PIQ.clamp(g[0], GX + 0.3, GX + 10), PIQ.clamp(g[1], -9, 9)], 0.35);
    };
    stage.on('groundDrag', steer);
    stage.on('ground', steer);
    s.innerHTML = head + '<p class="caption">You\'re the keeper. Stand between the ball and the middle of the goal, then tap <b>Ready</b>.</p><p class="small">Drag or tap on the field to move.' + keysHint + '</p>' +
      '<div class="row end"><button class="btn" id="mm-ready">Ready</button></div><div id="mm-foot"></div>';
    s._fit();
    var shoot = function () {
      var rb = s.querySelector('#mm-ready'); if (!rb) return;
      rb.parentNode.removeChild(rb);
      stage.keyPlayer = null;
      stage.on('groundDrag', null); stage.on('ground', null);
      stage.finishAll();
      var ball = stage.ball.pos.slice();
      var sides = [-POST + 0.35, POST - 0.35].map(function (z) { return { z: z, gap: PIQ.segDist(gk.pos, ball, [GX, z]) }; }).sort(function (a, b) { return b.gap - a.gap; });
      var target = [GX - 0.6, sides[0].z];
      var chip = gk.pos[0] - GX > 7;
      var gap = PIQ.segDist(gk.pos, ball, target);
      var saved = !chip && gap < 2.1;
      var ideal = PIQ.keeperIdeal(ball);
      var hit = saved ? [gk.pos[0] + (ball[0] - gk.pos[0]) * 0.08, gk.pos[1] + (ball[1] - gk.pos[1]) * 0.08] : target;
      stage.kickBall(hit, { height: chip ? 2.6 : 0.45, dur: chip ? 1 : 0.55, onDone: function () {
        stage.zone(ideal, 0.9, { color: PIQ.COLORS.good, pulse: true });
        if (saved) { stage.giveBall('GK'); gk.body.rotation.z = 0.8; stage.after(0.7, function () { gk.body.rotation.z = 0; }); }
        finish(saved ? 'best' : 'bad', saved ? 'Great spot! The green circle shows the very best spot.' : chip ? 'Too far out: she chipped it over you.' : 'The green circle shows the best spot: on the line from the ball to the middle of the goal.');
      } });
    };
    s.querySelector('#mm-ready').onclick = shoot;
    stage.on('enter', shoot);
  }

  // ---------- goals ----------
  function ourGoal(stage, cb) {
    stage.finishAll();
    var home = stage.list.filter(function (p) { return p.team === 'home' && p.role !== 'GK'; });
    var scorer = stage.players[stage.youId] && stage.youId !== 'GK' ? stage.players[stage.youId] : null;
    if (!scorer && stage.ball.owner && stage.ball.owner.team === 'home' && stage.ball.owner.role !== 'GK') scorer = stage.ball.owner;
    if (!scorer) scorer = home.sort(function (a, b) { return b.pos[0] - a.pos[0]; })[0];
    if (!scorer) { if (cb) cb(); return; }
    stage.ball.obj.visible = true;
    stage.giveBall(scorer.id);
    scorer.heading = Math.atan2(25 - scorer.pos[0], -scorer.pos[1] * 0.3);
    scorer.obj.rotation.y = scorer.heading;
    stage._carryBall();
    stage.after(0.35, function () {
      stage.kickBall([PIQ.FIELD.L / 2 + 0.6, (Math.random() - 0.5) * 3], { height: 0.5, dur: 0.75, onDone: function () {
        PIQ.sfx.cheer();
        stage.celebrate(scorer.id, PIQ.equipped().celebrate);
        PIQ.say(stage, scorer.id, PIQ.pick(['GOAL!', 'YES!', 'For you, {name}!', 'Get in!']), 2.5);
        if (cb) cb();
      } });
    });
  }
  function theirGoal(stage, cb) {
    stage.finishAll();
    var away = stage.list.filter(function (p) { return p.team === 'away' && p.role !== 'GK'; });
    var shooter = stage.ball.owner && stage.ball.owner.team === 'away' ? stage.ball.owner : away.sort(function (a, b) { return a.pos[0] - b.pos[0]; })[0];
    if (!shooter) { if (cb) cb(); return; }
    stage.ball.obj.visible = true;
    stage.giveBall(shooter.id);
    shooter.heading = Math.atan2(-25 - shooter.pos[0], -shooter.pos[1] * 0.3);
    shooter.obj.rotation.y = shooter.heading;
    stage._carryBall();
    stage.after(0.35, function () {
      stage.kickBall([-PIQ.FIELD.L / 2 - 0.6, (Math.random() - 0.5) * 3], { height: 0.5, dur: 0.75, onDone: function () {
        PIQ.sfx.bad();
        PIQ.chat(stage, 'keeperGoal', null, 2.5);
        if (cb) cb();
      } });
    });
  }

  PIQ.Moments = { pick: pick, run: run, ourGoal: ourGoal, theirGoal: theirGoal };
})();

/* js/games/matchday.js */
/* Pitch IQ — Match Day: two halves of challenges against a rival team.
   Our chances: a smart answer scores. Their chances: a smart answer stops them.
   (Real U10 games in Ontario keep no score; this is the app's own game.) */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};

  var RIVALS = ['Thunder', 'Comets', 'Wildcats', 'Rockets', 'Hurricanes', 'Falcons', 'Lightning', 'Panthers'];
  // minute marks for the eight moments (two 25-minute halves)
  var MINUTES = [4, 11, 17, 23, 29, 36, 42, 48];
  var TIPS = [
    'Coach says: spread out when we have the ball, squeeze in when they do.',
    'Coach says: scan before the ball arrives. Look, then look again.',
    'Coach says: if you get beaten, sprint back toward our goal.',
    'Coach says: look forward first. Can we score? Can we pass forward?',
    'Coach says: talk to each other. Names first, short and loud.'
  ];

  PIQ.GAMES.matchday = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var prof = PIQ.profile();
      var rival = PIQ.pick(RIVALS);
      var used = {};
      // each half: our chance, their chance, our chance, their chance
      var attackKinds = PIQ.shuffle(['decide', 'spoton', 'quiz', 'decide']);
      var defendKinds = PIQ.shuffle(['mistake', 'keeper', 'quiz', 'spoton']);
      var plan = [];
      for (var i = 0; i < 4; i++) {
        plan.push(PIQ.Moments.pick(attackKinds[i], 'attack', used));
        plan.push(PIQ.Moments.pick(defendKinds[i], 'defend', used));
      }
      var n = 0, us = 0, them = 0, smart = 0;
      var team = (PIQ.teamWord || 'blue').toUpperCase();

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Match Day', back);
      var sb = App.el('<div class="scoreboard" aria-live="polite"><span class="sb-team"><i style="background:' + hex(PIQ.TEAMS.home.shirt) + '"></i>' + PIQ.esc(team) + '</span>' +
        '<b id="sb-score">0 – 0</b><span class="sb-team">' + PIQ.esc(rival.toUpperCase()) + '<i style="background:' + hex(PIQ.TEAMS.away.shirt) + '"></i></span><span class="sb-min" id="sb-min">KO</span></div>');
      document.getElementById('ui').appendChild(sb);
      var s = App.sheet('', 'mini');

      function hex(c) { return '#' + ('000000' + c.toString(16)).slice(-6); }
      function board(min) {
        document.getElementById('sb-score').textContent = us + ' – ' + them;
        document.getElementById('sb-min').textContent = min;
      }

      function intro() {
        PIQ.buildScene(stage, { home: PIQ.SHAPES.kickoff, away: PIQ.SHAPES.kickoffAway, ball: [0, 0], camera: { target: [0, 0], dist: 46, theta: 0.5, phi: 1.0, portraitDist: 70, portraitTheta: 0.5 } }, { instantCamera: true });
        stage.autoSpin = 0.05;
        stage.after(0.8, function () { PIQ.chat(stage, 'matchStart', null, 3.5); });
        s.innerHTML = '<div class="eyebrow">Match Day</div><h2>' + PIQ.esc(team) + ' vs ' + PIQ.esc(rival) + '</h2>' +
          '<p>Two halves, eight big moments. When it\'s <b>our chance</b>, a smart answer scores a goal. When <b>they attack</b>, a smart answer stops them.</p>' +
          '<div class="row end"><button class="btn" id="md-ko">Kick off ' + I.next + '</button></div>';
        s._fit();
        var go = function () { PIQ.sfx.tap(); PIQ.sfx.whistle(); next(); };
        s.querySelector('#md-ko').onclick = go;
        stage.on('enter', go);
      }

      var htDone = false;
      function next() {
        if (n === 4 && !htDone) return halftime();
        if (n >= plan.length) return fulltime();
        var m = plan[n];
        var min = MINUTES[n] + "'";
        board(min);
        var attack = m.side === 'attack';
        var ctx = { App: App, stage: stage, sheet: s, eyebrow: min + ' &middot; ' + (attack ? 'Our chance!' : 'Danger! ' + PIQ.esc(rival) + ' attack') };
        PIQ.Moments.run(ctx, m, function (result, why) {
          if (result === 'best') smart++;
          var scored = attack && (result === 'best' || (result === 'ok' && Math.random() < 0.5));
          var conceded = !attack && result === 'bad' && (m.kind === 'keeper' || Math.random() < 0.85);
          var foot = s.querySelector('#mm-foot');
          var verdict;
          if (scored) { us++; verdict = 'GOAL! ' + PIQ.esc(team) + ' score!'; }
          else if (attack) verdict = result === 'ok' ? 'Shot saved. So close!' : 'Chance gone.';
          else if (conceded) { them++; verdict = PIQ.esc(rival) + ' score.'; }
          else verdict = result === 'best' ? 'Stopped them! Great defending.' : 'Phew, they missed!';
          var after = function () {
            board(min);
            if (scored) App.bigmsg('GOAL!', 1600);
            else if (conceded) App.bigmsg(PIQ.esc(rival) + ' score', 1300);
            foot.innerHTML = (why ? '<div class="why">' + why + '</div>' : '') +
              '<div class="row between" style="margin-top:10px"><b class="verdict ' + (scored || (!attack && !conceded) ? 'good' : 'bad') + '">' + verdict + '</b>' +
              '<button class="btn" id="md-next">' + (n === 3 ? 'Half-time' : n === plan.length - 1 ? 'Full time' : 'Next') + ' ' + I.next + '</button></div>';
            s._fit();
            var go = function () { PIQ.sfx.tap(); n++; next(); };
            foot.querySelector('#md-next').onclick = go;
            stage.on('enter', go);
          };
          if (scored) PIQ.Moments.ourGoal(stage, after);
          else if (conceded && m.kind !== 'keeper') PIQ.Moments.theirGoal(stage, after);
          else { if (!attack && !conceded) stage.cheer(); after(); }
        });
      }

      function halftime() {
        board('HT');
        PIQ.sfx.whistle();
        stage.clearAnnotations(); stage.clearLabels(true);
        s.innerHTML = '<div class="eyebrow">Half-time</div><h2>' + PIQ.esc(team) + ' ' + us + ' – ' + them + ' ' + PIQ.esc(rival) + '</h2>' +
          '<p class="coachnote">' + PIQ.esc(PIQ.pick(TIPS)) + '</p>' +
          '<div class="row end"><button class="btn" id="md-2h">Second half ' + I.next + '</button></div>';
        s._fit();
        var go = function () { PIQ.sfx.tap(); PIQ.sfx.whistle(); htDone = true; next(); };
        s.querySelector('#md-2h').onclick = go;
        stage.on('enter', go);
      }

      function fulltime() {
        board('FT');
        PIQ.sfx.whistle();
        var result = us > them ? 'win' : us === them ? 'draw' : 'loss';
        var rec = prof.match = prof.match || { played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, clean: 0, bestWin: 0 };
        rec.played++; rec.gf += us; rec.ga += them;
        if (result === 'win') { rec.won++; rec.bestWin = Math.max(rec.bestWin, us - them); }
        else if (result === 'draw') rec.drawn++; else rec.lost++;
        if (them === 0) rec.clean++;
        PIQ.saveProfile();
        PIQ.saveBest('matchday', us);
        if (result === 'win') PIQ.award('match');
        if (result === 'win' && them === 0) PIQ.award('clean');
        if (us >= 3) PIQ.award('hattrick');
        var xp = (result === 'win' ? 50 : result === 'draw' ? 30 : 20) + us * 5 + smart * 2;
        PIQ.addXP(xp);
        PIQ.markDay();
        if (result !== 'loss') PIQ.sfx.cheer();
        App.bigmsg(result === 'win' ? 'You win!' : result === 'draw' ? 'A draw!' : 'Good game!', 1800);
        stage.clearAnnotations(); stage.clearLabels(true);
        PIQ.chat(stage, result === 'win' ? 'matchWin' : result === 'draw' ? 'matchDraw' : 'matchLoss', null, 4);
        s.innerHTML = '<div class="eyebrow">Full time</div><h2>' + PIQ.esc(team) + ' ' + us + ' – ' + them + ' ' + PIQ.esc(rival) + '</h2>' +
          '<p>' + smart + ' of ' + plan.length + ' smart plays. +' + xp + ' XP and ' + xp + ' coins.</p>' +
          '<p class="small">Your record: ' + rec.won + ' won, ' + rec.drawn + ' drawn, ' + rec.lost + ' lost. ' + (result === 'loss' ? 'Every smart answer is a goal next time.' : '') + '</p>' +
          '<div class="row"><button class="btn ghost" id="md-home">Home</button><button class="btn" id="md-again">' + I.replay + ' Play another match</button></div>';
        s._fit();
        s.querySelector('#md-again').onclick = function () { PIQ.sfx.tap(); PIQ.GAMES.matchday.start(App, back); };
        s.querySelector('#md-home').onclick = function () { PIQ.sfx.tap(); back(); };
        stage.on('enter', null);
      }

      intro();
    }
  };
})();

/* js/games/daily.js */
/* Pitch IQ — Daily Challenge: five moments, the same all day, with a day streak.
   Coins and streak count once a day; replays are practice. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  PIQ.GAMES = PIQ.GAMES || {};

  function todaysPlan() {
    var key = PIQ.dayKey(new Date());
    var seed = 0;
    for (var i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
    var rnd = PIQ.seeded(seed);
    var kinds = ['quiz', 'spoton', 'mistake', 'decide', 'quiz'];
    for (var j = kinds.length - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)); var t = kinds[j]; kinds[j] = kinds[k]; kinds[k] = t; }
    var used = {};
    return kinds.map(function (kind) { return PIQ.Moments.pick(kind, 'any', used, rnd); });
  }

  PIQ.dailyState = function () {
    var prof = PIQ.profile();
    prof.daily = prof.daily || { last: '', streak: 0, best: 0, days: 0, score: 0 };
    var d = prof.daily;
    // a streak only survives if yesterday (or today) was played
    var today = PIQ.dayKey(new Date()), yest = PIQ.dayKey(new Date(Date.now() - 864e5));
    d.live = d.last === today || d.last === yest ? d.streak : 0;
    d.doneToday = d.last === today;
    return d;
  };

  PIQ.GAMES.daily = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var d = PIQ.dailyState();
      var practice = d.doneToday;
      var plan = todaysPlan();
      var n = 0, best = 0;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Daily Challenge', back, '<span class="chip" id="dy-prog">' + plan.map(function () { return '<span class="pip"></span>'; }).join('') + '</span>');
      var s = App.sheet('', 'mini');

      PIQ.buildScene(stage, { home: PIQ.SHAPES.midBall, away: PIQ.SHAPES.midBallAway, ball: 'CM', camera: { target: [0, 0], dist: 46, theta: 0.6, phi: 1.0, portraitDist: 70, portraitTheta: 0.6 } }, { instantCamera: true });
      stage.autoSpin = 0.05;
      stage.after(0.6, function () { PIQ.chat(stage, 'dailyStart', null, 3.5); });
      s.innerHTML = '<div class="eyebrow">' + (practice ? 'Already done today' : 'Today\'s challenge') + '</div><h2>Five quick moments</h2>' +
        '<p>' + (practice ? 'You\'ve finished today\'s challenge. Play it again for practice, or come back tomorrow for a new one.' :
          'A new mix every day. Finish it to earn coins and keep your streak going.') + '</p>' +
        '<p class="small">Day streak: <b>' + d.live + '</b> &middot; Best: ' + d.best + '</p>' +
        '<div class="row end"><button class="btn" id="dy-go">' + (practice ? 'Practise' : 'Start') + ' ' + I.next + '</button></div>';
      s._fit();
      var go = function () { PIQ.sfx.tap(); next(); };
      s.querySelector('#dy-go').onclick = go;
      stage.on('enter', go);

      function pip(i, cls) {
        var p = document.querySelectorAll('#dy-prog .pip')[i];
        if (p) p.className = 'pip ' + cls;
      }

      function next() {
        if (n >= plan.length) return finish();
        var m = plan[n];
        pip(n, 'now');
        PIQ.Moments.run({ App: App, stage: stage, sheet: s, eyebrow: 'Challenge ' + (n + 1) + ' of ' + plan.length }, m, function (result, why) {
          if (result === 'best') { best++; stage.cheer(); }
          pip(n, result === 'best' ? 'good' : result === 'ok' ? 'ok' : 'bad');
          var foot = s.querySelector('#mm-foot');
          foot.innerHTML = (why ? '<div class="why">' + why + '</div>' : '') +
            '<div class="row end" style="margin-top:10px"><button class="btn" id="dy-next">' + (n < plan.length - 1 ? 'Next' : 'Finish') + ' ' + I.next + '</button></div>';
          s._fit();
          var go2 = function () { PIQ.sfx.tap(); n++; next(); };
          foot.querySelector('#dy-next').onclick = go2;
          stage.on('enter', go2);
        });
      }

      function finish() {
        stage.on('enter', null);
        var prof = PIQ.profile();
        var dd = prof.daily;
        var msg;
        if (!practice) {
          var today = PIQ.dayKey(new Date()), yest = PIQ.dayKey(new Date(Date.now() - 864e5));
          dd.streak = dd.last === yest ? dd.streak + 1 : 1;
          dd.best = Math.max(dd.best, dd.streak);
          dd.days++;
          dd.last = today;
          dd.score = best;
          PIQ.saveProfile();
          var xp = 30 + best * 6;
          PIQ.addXP(xp);
          PIQ.addCoins(20);
          PIQ.markDay();
          if (dd.streak >= 3) PIQ.award('daily3');
          if (dd.streak >= 7) PIQ.award('daily7');
          msg = '+' + xp + ' XP and ' + (xp + 20) + ' coins (with a 20-coin daily bonus).';
        } else msg = 'Practice round: no coins, but every answer counts for your brain!';
        PIQ.saveBest('daily', best);
        PIQ.sfx.cheer();
        App.bigmsg(best === plan.length ? 'Perfect day!' : 'Daily done!', 1600);
        PIQ.chat(stage, 'dailyDone', null, 4);
        s.innerHTML = '<div class="eyebrow">Daily Challenge</div><h2>' + best + ' / ' + plan.length + ' smart plays</h2>' +
          '<p>' + msg + '</p><p class="small">Day streak: <b>' + (practice ? dd.streak : dd.streak) + '</b> &middot; Best streak: ' + dd.best + '. A new challenge appears tomorrow.</p>' +
          '<div class="row"><button class="btn" id="dy-home">Home</button></div>';
        s._fit();
        s.querySelector('#dy-home').onclick = function () { PIQ.sfx.tap(); back(); };
      }

/* js/board.js */
/* Pitch IQ — Tactics Board: drag anyone, pick a formation, and let
   "Auto shape" move both teams as the ball moves. */
(function () {
  'use strict';
  var PIQ = window.PIQ;
  var F = PIQ.FIELD;
  var AWAY_KEYS = { GK: 'GK', LD: 'D1', RD: 'D2', CD: 'D3', LW: 'M1', LM: 'M1', CM: 'M2', RW: 'M3', RM: 'M3', ST: 'F' };

  // where a team "should" be, in its own frame (attacking +x), for a ball at b
  function autoShape(base, b, have) {
    var out = {};
    var roles = Object.keys(base);
    roles.forEach(function (r) {
      var x = base[r][0], z = base[r][1];
      if (r === 'GK') {
        if (have) out[r] = [-F.L / 2 + PIQ.clamp(3 + (b[0] + 25) * 0.2, 2.5, 10), b[1] * 0.12];
        else out[r] = PIQ.keeperIdeal(b);
        return;
      }
      var nx, nz;
      if (have) {
        nx = x + b[0] * 0.7;
        nz = z + b[1] * 0.25;
        if (r === 'ST') nx = Math.max(nx, b[0] + 4);
        if ((r === 'LD' || r === 'RD' || r === 'CD') && b[0] > -12) nx = Math.min(nx, b[0] - 4);
      } else {
        nx = x * 0.7 + b[0] * 0.6 - 5;
        nz = z * 0.6 + b[1] * 0.45;
        if (r === 'ST') nx = PIQ.clamp(b[0] + 4, -5, 15);
        else nx = Math.min(nx, b[0] - 1.5);
      }
      out[r] = [PIQ.clamp(nx, -F.L / 2 + 3, F.L / 2 - 2), PIQ.clamp(nz, -F.W / 2 + 1.2, F.W / 2 - 1.2)];
    });
    if (!have) {
      // nearest field player presses from the goal-side
      var best = null, bd = 1e9;
      roles.forEach(function (r) { if (r !== 'GK') { var d = PIQ.dist(out[r], b); if (d < bd) { bd = d; best = r; } } });
      var gx = -F.L / 2 - b[0], gz = -b[1], gl = Math.sqrt(gx * gx + gz * gz) || 1;
      if (best) out[best] = [b[0] + gx / gl * 1.8, b[1] + gz / gl * 1.8];
    }
    return out;
  }

  PIQ.Board = {
    start: function (App, back) {
      var stage = App.stage();
      var I = App.ICONS;
      var cfg = { form: '2-3-1', have: true, auto: true, opp: true, draw: false };
      var selected = null, preview = null, p0 = null, lastAuto = 0;

      App.leave();
      App.setCurrent({ destroy: function () {} });
      App.topbar('Tactics Board', back);
      App.camDock(null);

      function homeBase() { return PIQ.FORMATIONS[cfg.form].shape; }
      function awayBase() {
        var b = PIQ.FORMATIONS['2-3-1'].shape, o = {};
        Object.keys(b).forEach(function (r) { o[AWAY_KEYS[r]] = b[r]; });
        return o;
      }
      function mirror(p) { return [-p[0], -p[1]]; }

      function setup() {
        var away = {};
        if (cfg.opp) {
          var ab = awayBase();
          Object.keys(ab).forEach(function (k) { away[k] = mirror(ab[k]); });
        }
        var cam = stage.lastPreset || 'broadcast';
        PIQ.buildScene(stage, { home: homeBase(), away: away, ball: [0, 0], camera: cam }, { keepCamera: true });
        var ids = stage.list.map(function (p) { return p.id; });
        stage.setDraggable(ids.concat(['ball']), true);
        stage.on('pick', function (p) {
          if (selected && selected.ring) selected.ring.visible = false;
          selected = p;
          stage.keyPlayer = p.isBall ? 'ball' : p.id;
          if (p.isBall) return;
          PIQ.setRing(p, PIQ.COLORS.info, true);
          if (p.team === 'home') PIQ.say(stage, p.id, PIQ.pick(PIQ.TALK.boardPick), 2.6);
          var eyes = document.getElementById('bd-eyes');
          if (eyes) eyes.disabled = false;
        });
        stage.on('dragMove', function (o) {
          if (!o.isBall || !cfg.auto) return;
          var now = Date.now();
          if (now - lastAuto < 140) return;
          lastAuto = now;
          applyAuto(0.7);
        });
        stage.on('dragEnd', function (o) { if (o.isBall && cfg.auto) applyAuto(0.7); });
        stage.on('groundDrag', cfg.draw ? drawHandler : null);
        if (cfg.auto) applyAuto(0.01);
      }

      function applyAuto(dur) {
        var b = stage.ball.pos;
        var h = autoShape(homeBase(), b, cfg.have);
        Object.keys(h).forEach(function (r) { if (stage.players[r]) stage.moveTo(r, h[r], dur); });
        if (cfg.opp) {
          var a = autoShape(awayBase(), mirror(b), !cfg.have);
          Object.keys(a).forEach(function (k) { if (stage.players['away:' + k]) stage.moveTo('away:' + k, mirror(a[k]), dur); });
        }
      }

      function drawHandler(g, phase, moved) {
        if (phase === 'start') { p0 = g; return; }
        if (!p0 || !g) return;
        if (preview) { stage.annot.remove(preview); preview = null; }
        if (PIQ.dist(p0, g) < 1) return;
        var a = stage.arrow(p0, g, 'run', { startCut: 0, endCut: 0 });
        if (phase === 'move') preview = a;
        else p0 = null;
      }

      var s = App.sheet(
        '<div class="toolbar" style="margin-bottom:8px">' +
          '<div class="seg" id="bd-form">' + Object.keys(PIQ.FORMATIONS).map(function (f) { return '<button data-f="' + f + '" class="' + (f === cfg.form ? 'on' : '') + '">' + f + '</button>'; }).join('') + '</div>' +
          '<div class="seg" id="bd-have"><button data-h="1" class="on">We have it</button><button data-h="0">They have it</button></div>' +
        '</div>' +
        '<div class="toolbar">' +
          '<button class="btn small chalk" id="bd-auto">Auto shape: on</button>' +
          '<button class="btn small ghost" id="bd-opp">Opponents: on</button>' +
          '<button class="btn small ghost" id="bd-draw">Draw runs: off</button>' +
          '<button class="btn small ghost" id="bd-eyes" disabled>' + I.eye + ' Her eyes</button>' +
          '<button class="btn small ghost" id="bd-clear">Clear runs</button>' +
          '<button class="btn small ghost" id="bd-reset">' + I.replay + ' Reset</button>' +
        '</div>' +
        '<p class="small" style="margin:10px 0 0">Drag any player or the ball. With <b>Auto shape</b> on, drag the ball and watch both teams move. Tap a player, then <b>Her eyes</b> to see what she sees' + (PIQ.hasKeys ? ', or move her with the arrow keys' : '') + '. Spin and pinch the field to look around.</p>', 'mini');

      s.querySelector('#bd-form').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-f]') : null;
        if (!b) return;
        PIQ.sfx.tap();
        cfg.form = b.getAttribute('data-f');
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        setup();
      };
      s.querySelector('#bd-have').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-h]') : null;
        if (!b) return;
        PIQ.sfx.tap();
        cfg.have = b.getAttribute('data-h') === '1';
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
        if (cfg.auto) applyAuto(0.9);
      };
      function toggle(id, key, label, onChange) {
        var b = s.querySelector(id);
        b.onclick = function () {
          PIQ.sfx.tap();
          cfg[key] = !cfg[key];
          b.textContent = label + ': ' + (cfg[key] ? 'on' : 'off');
          b.className = 'btn small ' + (cfg[key] ? 'chalk' : 'ghost');
          if (onChange) onChange();
        };
      }
      toggle('#bd-auto', 'auto', 'Auto shape', function () { if (cfg.auto) applyAuto(0.9); });
      toggle('#bd-opp', 'opp', 'Opponents', setup);
      toggle('#bd-draw', 'draw', 'Draw runs', function () { stage.on('groundDrag', cfg.draw ? drawHandler : null); });
      s.querySelector('#bd-draw').className = 'btn small ghost';
      s.querySelector('#bd-eyes').onclick = function () {
        if (!selected || selected.isBall) return;
        PIQ.sfx.tap();
        if (stage.pov) stage.setCamera(stage.lastPreset || 'broadcast');
        else stage.setPOV(selected.id);
      };
      s.querySelector('#bd-clear').onclick = function () { PIQ.sfx.tap(); stage.clearAnnotations(); };
      s.querySelector('#bd-reset').onclick = function () { PIQ.sfx.tap(); selected = null; stage.keyPlayer = null; stage.setCamera('broadcast'); setup(); };

      stage.setCamera('broadcast');
      setup();
      PIQ.markDay();
    }
  };
})();

      if (window.MutationObserver) new MutationObserver(function () { if (s.classList.contains('collapsed')) setCollapsed(false); else fit(); }).observe(s, { childList: true });
      fit();
      setTimeout(fit, 60);
      s._fit = fit;
    },
    // camera buttons; youId enables "her eyes"
    camDock: function (youId, extra) {
      if (PIQ.SMALL_SCREEN && window.innerWidth < window.innerHeight && !App._rotateTip) {
        App._rotateTip = true;
        var tip = el('<div class="rotate-tip">Tip: turn your phone sideways for a bigger field</div>');

        setTimeout(function () { if (tip.parentNode) tip.parentNode.removeChild(tip); }, 5000);
      }
      var html = '<div class="camdock">' +
        '<button data-cam="broadcast" aria-label="TV view">' + I.tv + 'TV</button>' +
        '<button data-cam="top" aria-label="Top view">' + I.top + 'TOP</button>' +
        '<button data-cam="behind" aria-label="Behind the goal">' + I.goal + 'GOAL</button>' +
        (youId ? '<button data-cam="eyes" aria-label="Her eyes">' + I.eye + 'EYES</button>' : '') +
        (extra || '') + '</div>';
      var d = el(html);
      ui.appendChild(d);
      d.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button') : null;
        if (!b || !b.getAttribute('data-cam')) return;
        PIQ.sfx.tap();
        var c = b.getAttribute('data-cam');
        if (c === 'eyes') {
          if (stage.pov) stage.setCamera(stage.lastPreset || 'broadcast');
          else stage.setPOV(youId);
        } else stage.setCamera(c);
        Array.prototype.forEach.call(d.querySelectorAll('button[data-cam]'), function (x) { x.classList.toggle('on', x === b && !(c === 'eyes' && !stage.pov)); });
      });
      return d;
    },
    stars: function (n, max) {
      max = max || 3;
      var s = '<span class="stars" aria-label="' + n + ' of ' + max + ' stars">';
      for (var i = 0; i < max; i++) s += i < n ? '&#9733;' : '<span class="off">&#9733;</span>';
      return s + '</span>';
    },
    bigmsg: function (text, ms) {
      var m = el('<div class="bigmsg">' + text + '</div>');
      ui.appendChild(m);
      setTimeout(function () { if (m.parentNode) m.parentNode.removeChild(m); }, ms || 1300);
    },
    // multiple-choice question; calls done(correct)
    question: function (container, q, done) {
      var order = PIQ.shuffle(q.a.map(function (a, i) { return i; }));
      var keys = 'ABCD';
      var html = '<p class="caption">' + PIQ.teamText(q.q) + '</p><div class="answers">' +
        order.map(function (idx, n) { return '<button class="answer" data-i="' + idx + '"><span class="k">' + keys[n] + '</span><span>' + esc(q.a[idx]) + '</span></button>'; }).join('') +
        '</div><div class="why" hidden></div>';
      container.innerHTML = html;
      var box = container.querySelector('.answers');
      box.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.answer') : null;
        if (!b || box.classList.contains('locked')) return;
        box.classList.add('locked');
        var i = +b.getAttribute('data-i');
        var ok = i === q.c;
        Array.prototype.forEach.call(box.children, function (x) {
          var xi = +x.getAttribute('data-i');
          if (xi === q.c) x.classList.add('right');
          else if (x === b) x.classList.add('wrong');
          else x.classList.add('dim');
        });
        if (ok) PIQ.sfx.good(); else PIQ.sfx.bad();
        var why = container.querySelector('.why');
        why.innerHTML = (ok ? '<b>Yes!</b> ' : '<b>Not quite.</b> ') + PIQ.teamText(q.why);
        why.hidden = false;
        if (container._fit) container._fit();
        done(ok);
      });
    },
    sceneFor: function (q) {
      if (q.scene) PIQ.buildScene(stage, q.scene, { instantCamera: false });
    }
  };

  // ---------- ambient home scene ----------
  function ambient() {
    PIQ.buildScene(stage, { home: PIQ.SHAPES.midBall, away: PIQ.SHAPES.midBallAway, ball: 'CM', camera: { target: [0, 0], dist: 46, theta: 0.6, phi: 1.0, portraitDist: 70, portraitTheta: 0.6 } }, { instantCamera: true });
    stage.autoSpin = 0.04;
    var order = ['CM', 'LW', 'ST', 'RW', 'CM', 'RD', 'LD', 'CM'];
    var i = 0;
    var alive = true;
    function step() {
      if (!alive) return;
      i = (i + 1) % order.length;
      var to = order[i];
      if (stage.players[to] && stage.ball.owner && stage.ball.owner.id !== to) stage.kickBall(PIQ.pt(stage, to), { owner: to, silent: true });
      // drift the team shape a little so the scene breathes
      var base = PIQ.SHAPES.midBall;
      Object.keys(base).forEach(function (r) {
        if (r === to) return;
        var p = base[r];
        stage.moveTo(r, [p[0] + (Math.random() - 0.5) * 4, p[1] + (Math.random() - 0.5) * 4], 2.2);
      });
      // now and then someone talks to her
      if (Math.random() < 0.45) PIQ.chat(stage, 'ambient', null, 2.6);
      stage.after(2.6, step);
    }
    stage.after(1.5, step);
    return { destroy: function () { alive = false; } };
  }

  screens.lesson = function (ui_, li, back) {
    var u = PIQ.UNITS[ui_], l = u.lessons[li];
    back = back || function () { screens.unit(ui_); };
    App.leave();
    var lp = new PIQ.LessonPlayer(stage, l, {});
    App.setCurrent(lp);
    App.topbar(esc(l.title), back);
    App.camDock(l.scene.you || null, '<button data-slow aria-label="Slow motion">' + I.slow + 'SLOW</button>');
    var dock = ui.querySelector('.camdock');
    dock.querySelector('[data-slow]').onclick = function (e) {
      stage.speedScale = stage.speedScale === 0.5 ? 1 : 0.5;
      e.currentTarget.classList.toggle('on', stage.speedScale === 0.5);
      PIQ.sfx.tap();
    };
    var s = App.sheet('<div class="eyebrow" id="ls-eb"></div><div class="caption" id="ls-cap"></div>' +
      '<div class="row between" style="margin-top:12px"><div class="row"><button class="iconbtn" id="ls-prev" aria-label="Previous">' + I.back + '</button>' +
      '<button class="iconbtn" id="ls-replay" aria-label="Replay">' + I.replay + '</button></div>' +
      '<button class="btn" id="ls-next">Next ' + I.next + '</button></div>', 'mini');
    var cap = s.querySelector('#ls-cap'), eb = s.querySelector('#ls-eb'), nextB = s.querySelector('#ls-next');
    function show(i) {
      lp.go(i);
      eb.textContent = 'Step ' + (i + 1) + ' of ' + lp.count();
      cap.innerHTML = PIQ.teamText(l.beats[i].say);
      nextB.innerHTML = i === lp.count() - 1 ? 'Quick check ' + I.next : 'Next ' + I.next;
      s.querySelector('#ls-prev').disabled = i === 0;
      s._fit();
      Array.prototype.forEach.call(dock.querySelectorAll('button[data-cam]'), function (x) { x.classList.remove('on'); });
    }
    s.querySelector('#ls-prev').onclick = function () { PIQ.sfx.tap(); if (lp.i > 0) show(lp.i - 1); };
    s.querySelector('#ls-replay').onclick = function () { PIQ.sfx.tap(); show(lp.i); };
    nextB.onclick = function () {
      PIQ.sfx.tap();
      if (lp.i < lp.count() - 1) show(lp.i + 1);
      else check();
    };
    show(0);

    function check() {
      var qs = PIQ.shuffle(PIQ.quizForLesson(l.id)).slice(0, 2);
      var right = 0, n = 0;
      stage.clearAnnotations(); stage.clearLabels(true);
      if (!qs.length) return finish(3);
      function ask() {
        if (n >= qs.length) return finish(1 + right);
        var q = qs[n];
        s.innerHTML = '<div class="eyebrow">Quick check ' + (n + 1) + ' of ' + qs.length + '</div><div id="qbox"></div><div class="row end" style="margin-top:12px"><button class="btn" id="q-next" hidden>Next ' + I.next + '</button></div>';
        var box = s.querySelector('#qbox');
        box._fit = s._fit;
        if (q.scene) App.sceneFor(q);
        App.question(box, q, function (ok) {
          PIQ.chat(stage, ok ? 'quizRight' : 'quizWrong');
          if (ok) right++;
          n++;
          var nb = s.querySelector('#q-next');
          nb.hidden = false;
          nb.onclick = function () { PIQ.sfx.tap(); ask(); };
          s._fit();
        });
        s._fit();
      }
      ask();
    }
    function finish(stars) {
      stars = Math.min(3, stars);
      var prev = state.lessons[l.id] || 0;
      var first = !prev;
      state.lessons[l.id] = Math.max(prev, stars);
      save();
      PIQ.addXP((first ? 20 : 5) + stars * 5);
      markDay();
      PIQ.award('first');
      ['shape', 'attack', 'defend', 'lead'].forEach(function (id) {
        var unit = PIQ.UNITS.filter(function (x) { return x.id === id; })[0];
        if (unit && unitProgress(unit) === unit.lessons.length) PIQ.award(id);
      });
      var all = PIQ.UNITS.every(function (x) { return unitProgress(x) === x.lessons.length; });
      if (all) PIQ.award('allLessons');
      PIQ.sfx.cheer();
      App.bigmsg(stars === 3 ? 'Brilliant!' : 'Nice work!');
      PIQ.chat(stage, 'lessonEnd', null, 4);
      var nextL = li + 1 < u.lessons.length ? li + 1 : null;
      s.innerHTML = '<div class="eyebrow">Lesson done</div><h2>' + esc(l.title) + '</h2><p>' + App.stars(stars) + '</p>' +
        '<p class="small">' + (stars === 3 ? 'Perfect check. You\'ve got this one!' : 'Watch it again any time to get all 3 stars.') + '</p>' +
        '<div class="row"><button class="btn ghost" id="f-again">' + I.replay + ' Again</button>' +
        (nextL !== null ? '<button class="btn" id="f-next">Next lesson ' + I.next + '</button>' : '<button class="btn" id="f-unit">Back to unit</button>') + '</div>';
      s._fit();
      s.querySelector('#f-again').onclick = function () { PIQ.sfx.tap(); screens.lesson(ui_, li, back); };
      var fn = s.querySelector('#f-next');
      if (fn) fn.onclick = function () { PIQ.sfx.tap(); screens.lesson(ui_, nextL, back); };
      var fu = s.querySelector('#f-unit');
      if (fu) fu.onclick = function () { PIQ.sfx.tap(); back(); };
    }
  };

    if (rb) rb.onclick = function () {
      if (rb.getAttribute('data-armed')) {
        state.xp = 0; state.lessons = {}; state.games = {}; state.badges = {}; state.days = [];
        save();
        s.querySelector('#p-reset-msg').textContent = 'Progress reset.';
        rb.removeAttribute('data-armed'); rb.textContent = 'Reset progress';
      } else {
        rb.setAttribute('data-armed', '1');
        rb.textContent = 'Tap again to reset';
        s.querySelector('#p-reset-msg').textContent = 'This clears XP, stars and badges.';
      }
    };
  };

  // ---------- Locker Room ----------
  function swatchCss(cat, id) {
    var c = hexCss(PIQ.TEAMS.home.shirt), con = hexCss(PIQ.contrastOf(PIQ.TEAMS.home.shirt));
    if (cat === 'kit') {
      return {
        plain: c,
        sleeves: 'linear-gradient(90deg,' + con + ' 20%,' + c + ' 20% 80%,' + con + ' 80%)',
        stripes: 'repeating-linear-gradient(90deg,' + c + ' 0 7px,' + con + ' 7px 12px)',
        hoops: 'repeating-linear-gradient(0deg,' + c + ' 0 8px,' + con + ' 8px 13px)',
        sash: 'linear-gradient(60deg,' + c + ' 38%,' + con + ' 38% 56%,' + c + ' 56%)',
        halves: 'linear-gradient(90deg,' + c + ' 50%,' + con + ' 50%)',
        chevron: 'linear-gradient(135deg,' + c + ' 40%,' + con + ' 40% 50%,' + c + ' 50%) top/50% 100% no-repeat,linear-gradient(225deg,' + c + ' 40%,' + con + ' 40% 50%,' + c + ' 50%) right top/50% 100% no-repeat,' + c
      }[id] || c;
    }
    if (cat === 'ball' && id === 'team') return c;
    if (cat === 'ball' && id === 'rainbow') return 'linear-gradient(180deg,#ff5a5f,#ff9a3d,#ffe14d,#3ddc84,#3a7bd5,#7b3fe4)';
    if (cat === 'celebrate') return 'var(--board-2)';
    var map = PIQ.UNLOCK_SWATCH[cat] || {};
    return map[id] != null ? hexCss(map[id]) : '#888';
  }

  screens.locker = function (cat) {
    cat = cat || 'kit';
    App.leave();
    var tryOn = {};
    var restore = { destroy: function () { stage.setTheme(state.equip.stadium); PIQ.setBallDesign(stage.ball, state.equip.ball); } };
    App.setCurrent(restore);
    App.topbar('Locker Room', screens.home, '<span class="chip coins" id="lk-coins">' + I.coin + '<b>' + state.coins + '</b></span>');
    var selected = state.equip[cat];

    function preview(celebrate) {
      var saved = state.equip;
      var eq = {};
      for (var k in saved) eq[k] = tryOn[k] || saved[k];
      state.equip = eq;
      var hd = 0.35;
      PIQ.buildScene(stage, { home: { CM: [0, 0], LW: [-3.2, -2.6], RW: [-3.2, 2.6] }, ball: [Math.sin(hd) * 0.9, Math.cos(hd) * 0.9], you: 'CM',
        camera: { target: [0, 0, 1.25], dist: 7.5, theta: hd, phi: 1.32, portraitDist: 11, portraitTheta: hd } }, { noYou: true, instantCamera: true });
      PIQ.setBallDesign(stage.ball, eq.ball);
      stage.setTheme(eq.stadium);
      state.equip = saved;
      stage.list.forEach(function (p) { p.faceBall = false; p.heading = hd; p.obj.rotation.y = hd; });
      stage.autoSpin = 0.22;
      if (celebrate) stage.after(0.3, function () { stage.celebrate('CM', celebrate); });
      else stage.after(0.5, function () { PIQ.chat(stage, 'lockerHi', 'LW', 2.6); });
    }

    var s = App.sheet('', 'tall');
    function render() {
      var items = PIQ.UNLOCKS[cat];
      var catInfo = PIQ.UNLOCK_CATS.filter(function (c) { return c.id === cat; })[0];
      var sel = items.filter(function (x) { return x.id === selected; })[0] || items[0];
      var owned = PIQ.owns(cat, sel.id), equipped = state.equip[cat] === sel.id;
      var action;
      if (equipped) action = '<button class="btn" disabled>Wearing it</button>';
      else if (owned) action = '<button class="btn" id="lk-equip">' + (cat === 'stadium' ? 'Play here' : cat === 'celebrate' ? 'Use it' : 'Wear it') + '</button>';
      else if (state.coins >= sel.cost) action = '<button class="btn" id="lk-buy">' + I.coin + ' Buy for ' + sel.cost + '</button>';
      else action = '<button class="btn" disabled>Need ' + (sel.cost - state.coins) + ' more coins</button>';
      s.innerHTML = '<div class="seg" id="lk-cats" style="margin-bottom:10px;flex-wrap:wrap">' + PIQ.UNLOCK_CATS.map(function (c) { return '<button data-c="' + c.id + '" class="' + (c.id === cat ? 'on' : '') + '">' + c.name + '</button>'; }).join('') + '</div>' +
        '<p class="small" style="margin:0 0 10px">' + esc(catInfo.blurb) + ' Coins come from everything you play.</p>' +
        '<div class="lockgrid">' + items.map(function (it) {
          var own = PIQ.owns(cat, it.id), on = state.equip[cat] === it.id;
          return '<button class="lockcard' + (it.id === selected ? ' sel' : '') + (own ? '' : ' locked') + '" data-i="' + it.id + '">' +
            '<span class="sw" style="background:' + swatchCss(cat, it.id) + '">' + (cat === 'celebrate' ? I.star : '') + '</span>' +
            '<b>' + esc(it.name) + '</b><span class="st">' + (on ? 'Wearing' : own ? 'Owned' : it.cost + ' coins') + '</span></button>';
        }).join('') + '</div>' +
        '<div class="row between" style="margin-top:12px"><span class="grow"><b>' + esc(sel.name) + '</b></span>' + action + '</div>';
      s._fit();
      var b = s.querySelector('#lk-buy');
      if (b) b.onclick = function () {
        if (!PIQ.buy(cat, sel.id)) return;
        PIQ.equipItem(cat, sel.id);
        if (cat === 'kit') applyJersey();
        PIQ.sfx.levelUp();
        toast('Unlocked: <b>' + esc(sel.name) + '</b>!');
        document.getElementById('lk-coins').innerHTML = I.coin + '<b>' + state.coins + '</b>';
        tryOn = {};
        preview(cat === 'celebrate' ? sel.id : state.equip.celebrate);
        render();
      };
      var e = s.querySelector('#lk-equip');
      if (e) e.onclick = function () {
        PIQ.equipItem(cat, sel.id);
        PIQ.sfx.good();
        tryOn = {};
        preview(cat === 'celebrate' ? sel.id : null);
        render();
      };
    }
    s.addEventListener('click', function (ev) {
      var c = ev.target.closest ? ev.target.closest('[data-c]') : null;
      if (c) { PIQ.sfx.tap(); cat = c.getAttribute('data-c'); selected = state.equip[cat]; tryOn = {}; preview(); render(); return; }
      var it = ev.target.closest ? ev.target.closest('[data-i]') : null;
      if (it) {
        PIQ.sfx.tap();
        selected = it.getAttribute('data-i');
        tryOn = {}; tryOn[cat] = selected;
        preview(cat === 'celebrate' ? selected : null);
        render();
      }
    });
    preview();
    render();
  };

  // ---------- Trophy Room ----------
  screens.trophies = function () {
    App.leave();
    App.setCurrent(ambient());
    App.topbar('Trophies', screens.home);
    var lessonStars = 0, lessonMax = 0, spotStars = 0;
    PIQ.UNITS.forEach(function (u) { u.lessons.forEach(function (l) { lessonMax += 3; lessonStars += state.lessons[l.id] || 0; }); });
    var ss = state.games.spotonStars || {};
    Object.keys(ss).forEach(function (k) { spotStars += ss[k]; });
    var m = state.match || { played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, clean: 0 };
    var d = PIQ.dailyState();
    var lv = levelOf(state.xp);
    function stat(label, value) { return '<div class="stat"><span>' + label + '</span><b>' + value + '</b></div>'; }
    var bests = [['spoton', 'Spot On', 'stars'], ['mistake', 'Spot the Mistake', 'found'], ['decide', 'Pass, Dribble or Shoot?', 'points'], ['keeper', 'Keeper Hero', 'saves'], ['quizblitz', 'Quiz Blitz', 'points'], ['matchday', 'Match Day', 'goals in a match'], ['daily', 'Daily Challenge', 'smart plays']];
    var html = '<div class="eyebrow">' + esc(lv.name) + '</div><h2>Trophy room</h2>' +
      '<div class="stats">' +
        stat('XP', state.xp) + stat('Coins', state.coins) +
        stat('Lesson stars', lessonStars + ' / ' + lessonMax) + stat('Spot On stars', spotStars + ' / ' + PIQ.SPOTON.length * 3) +
        stat('Matches', m.won + 'W ' + m.drawn + 'D ' + m.lost + 'L') + stat('Goals scored', m.gf) +
        stat('Clean sheets', m.clean || 0) + stat('Daily streak', d.live + ' (best ' + d.best + ')') +
      '</div>' +
      '<h3 style="margin-top:16px">Personal bests</h3><div class="list">' + bests.map(function (b) {
        var v = state.games[b[0]];
        return '<div class="item"><div class="num">' + I.trophy + '</div><div class="txt"><b>' + b[1] + '</b><span>' + (v != null ? 'Best: ' + v + ' ' + b[2] : 'Not played yet') + '</span></div></div>';
      }).join('') + '</div>' +
      '<h3 style="margin-top:16px">Trophy case</h3><div class="badges">' + PIQ.BADGES.map(function (b) {
        var on = !!state.badges[b.id];
        return '<div class="badge trophy ' + (on ? 'on' : 'off') + '">' + I.trophy + '<b>' + esc(b.name) + '</b>' + esc(b.d) + '</div>';
      }).join('') + '</div>';
    App.sheet(html, 'tall');
  };

  PIQ.screens = screens;

  // ---------- boot ----------
  function boot() {
    ui = document.getElementById('ui');
    applyJersey();
    PIQ.sfx.setMuted(!state.settings.sound);
    stage = new PIQ.Stage(document.getElementById('stage'));
    if (!stage.ok) {
      document.getElementById('app').appendChild(el('<div class="nogl"><div><h2 style="font-family:var(--display)">3D isn\'t available</h2><p>This browser couldn\'t start 3D graphics (WebGL). Try Safari or Chrome with hardware acceleration turned on.</p></div></div>'));
      return;
    }
    if (state.settings.quality === 'low') stage.setQuality('low');
    stage.setTheme(state.equip.stadium);
    PIQ.stageRef = stage;
    window.addEventListener('resize', function () {
      var s = ui.querySelector('.sheet');
      if (s && s._fit) s._fit();
    });
    var start = (location.hash || '').replace('#', '');
    if (start && screens[start]) screens[start](); else screens.home();
    markDay();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
