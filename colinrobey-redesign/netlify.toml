# Redesign preview. Deploying this folder as its own Netlify site keeps it out of search
# (PREVIEW defaults to on). At go-live, set PREVIEW = "false" in the same change that points
# colinrobey.ca at this build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PREVIEW = "true"
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
